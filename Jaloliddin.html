<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Inson — Jaloliddin Komolov</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400;1,600&family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #1c1410;
      --accent-primary: #c17817;
      --accent-secondary: #8b2500;
      --text-main: #f4e8d0;
      --text-date: #ff8c42;
      --text-muted: #9a8878;
      --overlay: rgba(28, 20, 16, 0.97);
      --card-bg: rgba(255, 255, 255, 0.02);
      --card-border: rgba(193, 120, 23, 0.18);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; overflow-x: hidden; }

    body {
      background: var(--bg-main);
      color: var(--text-main);
      font-family: 'Crimson Text', serif;
      min-height: 100vh;
      overflow-x: hidden;
      cursor: none;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 220px rgba(0,0,0,0.6);
      z-index: 1;
    }

    ::selection { background: var(--accent-primary); color: var(--bg-main); }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-main); }
    ::-webkit-scrollbar-thumb { background: var(--accent-primary); border-radius: 3px; }

    @media (hover: none) and (pointer: coarse) {
      body { cursor: auto; }
      #custom-cursor { display: none !important; }
    }

    /* ── NOISE TEXTURE ── */
    .noise {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      opacity: 0.06; mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* ── AMBIENT GRADIENTS ── */
    .ambient {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    }
    .ambient-1 {
      position: absolute; top: 8%; left: 3%;
      width: 55vw; height: 55vw;
      background: radial-gradient(circle, rgba(193,120,23,0.13), transparent 70%);
      filter: blur(100px);
      animation: float 22s ease-in-out infinite;
    }
    .ambient-2 {
      position: absolute; bottom: 8%; right: 3%;
      width: 45vw; height: 45vw;
      background: radial-gradient(circle, rgba(139,37,0,0.10), transparent 70%);
      filter: blur(100px);
      animation: float 28s ease-in-out infinite reverse;
    }
    .ambient-3 {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 30vw; height: 30vw;
      background: radial-gradient(circle, rgba(193,120,23,0.05), transparent 70%);
      filter: blur(80px);
      animation: float 18s ease-in-out infinite 4s;
    }
    @keyframes float {
      0%,100% { transform: translate(0,0) scale(1); }
      33% { transform: translate(3%,2%) scale(1.05); }
      66% { transform: translate(-2%,3%) scale(0.97); }
    }

    /* ── CUSTOM CURSOR ── */
    #custom-cursor {
      position: fixed; top: 0; left: 0;
      width: 12px; height: 12px;
      background: var(--accent-primary);
      border-radius: 50%;
      pointer-events: none; z-index: 9999;
      transform: translate(-50%,-50%);
      transition: width 0.3s ease, height 0.3s ease, opacity 0.3s ease;
      mix-blend-mode: screen;
    }
    #custom-cursor.expanded {
      width: 40px; height: 40px;
      background: transparent;
      border: 1px solid var(--accent-primary);
    }

    /* ── HEADER ── */
    header {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 80;
      padding: 2.5rem 3rem;
      display: flex; align-items: flex-start; justify-content: space-between;
      pointer-events: none;
    }
    .header-brand { pointer-events: none; }
    .header-author {
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 0.3em;
      color: var(--text-main);
      text-transform: uppercase;
    }
    .header-collection {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 0.15em;
      margin-top: 0.3rem;
    }
    .header-stats {
      pointer-events: auto;
      display: flex; align-items: center; gap: 0.5rem;
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      padding-top: 0.2rem;
    }
    .header-stats .read-icon { color: var(--accent-primary); font-size: 0.9rem; }

    /* ── MAIN GRID ── */
    main {
      position: relative; z-index: 2;
      max-width: 1400px; margin: 0 auto;
      padding: 12rem 3rem 10rem;
    }
    #poems-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 2rem;
    }

    /* ── POEM CARD ── */
    .poem-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 2rem;
      position: relative;
      cursor: none;
      transition: transform 0.6s cubic-bezier(0.4,0,0.2,1),
                  box-shadow 0.6s cubic-bezier(0.4,0,0.2,1),
                  border-color 0.6s ease,
                  background 0.6s ease;
      overflow: hidden;
      opacity: 0;
      transform: translateY(30px);
      will-change: transform, box-shadow;
    }
    .poem-card.visible {
      animation: card-in 0.8s cubic-bezier(0.4,0,0.2,1) forwards;
    }
    @keyframes card-in {
      to { opacity: 1; transform: translateY(0); }
    }
    .poem-card::before {
      content: '';
      position: absolute; inset: 0;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='p'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23p)'/%3E%3C/svg%3E");
      opacity: 0.025; pointer-events: none;
    }
    /* corner ornaments */
    .poem-card::after {
      content: '';
      position: absolute; inset: 6px;
      border: 1px solid transparent;
      transition: border-color 0.5s ease;
      pointer-events: none;
    }
    .poem-card:hover {
      transform: scale(1.02) translateY(-6px);
      box-shadow: 0 24px 60px rgba(193,120,23,0.18), 0 4px 20px rgba(0,0,0,0.6);
      border-color: rgba(193,120,23,0.5);
      background: rgba(255,255,255,0.035);
    }
    .poem-card:hover::after {
      border-color: rgba(193,120,23,0.12);
    }

    /* date block */
    .date-block {
      display: inline-flex; flex-direction: column; align-items: center;
      border: 1px solid rgba(193,120,23,0.35);
      padding: 0.5rem 0.8rem;
      margin-bottom: 1.4rem;
      position: relative;
      transition: box-shadow 0.5s ease;
      background: rgba(28,20,16,0.5);
    }
    .poem-card:hover .date-block {
      animation: date-glow 2s ease-in-out infinite;
    }
    @keyframes date-glow {
      0%,100% { box-shadow: 0 0 0 rgba(193,120,23,0); }
      50% { box-shadow: 0 0 18px rgba(193,120,23,0.45); }
    }
    .date-day {
      font-family: 'Cinzel', serif;
      font-size: 2rem; font-weight: 600;
      color: var(--text-date);
      line-height: 1;
    }
    .date-month {
      font-family: 'Cinzel', serif;
      font-size: 0.65rem; font-weight: 400;
      letter-spacing: 0.2em;
      color: var(--accent-primary);
      margin-top: 0.2rem;
    }
    .date-year {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 0.15rem;
      letter-spacing: 0.1em;
    }

    /* card ornament */
    .card-ornament {
      position: absolute; top: 1.4rem; right: 1.6rem;
      color: rgba(193,120,23,0.2);
      font-size: 1rem;
      transition: color 0.4s ease, transform 0.4s ease;
    }
    .poem-card:hover .card-ornament {
      color: rgba(193,120,23,0.55);
      transform: rotate(15deg);
    }

    .card-title {
      font-family: 'Crimson Text', serif;
      font-size: 1.4rem; font-weight: 600;
      color: var(--text-main);
      line-height: 1.4;
      margin-bottom: 0.8rem;
    }

    .card-divider {
      width: 100%; height: 1px;
      background: linear-gradient(to right, var(--accent-primary), transparent);
      opacity: 0.3;
      margin-bottom: 0.9rem;
    }

    .card-preview {
      font-family: 'Crimson Text', serif;
      font-style: italic;
      font-size: 0.95rem;
      color: rgba(244,232,208,0.55);
      line-height: 1.75;
      -webkit-mask-image: linear-gradient(to bottom, black 30%, transparent 100%);
      mask-image: linear-gradient(to bottom, black 30%, transparent 100%);
      max-height: 5rem;
      overflow: hidden;
    }

    .card-read-btn {
      display: flex; align-items: center; gap: 0.5rem;
      font-family: 'Cinzel', serif;
      font-size: 0.65rem; letter-spacing: 0.25em;
      color: var(--accent-primary);
      text-transform: uppercase;
      margin-top: 1.2rem;
      opacity: 0;
      transform: translateX(-8px);
      transition: opacity 0.4s ease, transform 0.4s ease;
      cursor: none;
    }
    .poem-card:hover .card-read-btn {
      opacity: 1; transform: translateX(0);
    }
    .card-read-btn::before {
      content: '⟶';
      font-size: 0.9rem;
    }

    /* ── EMPTY STATE ── */
    #empty-state {
      display: none; flex-direction: column; align-items: center;
      justify-content: center; padding: 8rem 2rem; text-align: center;
    }
    #empty-state.visible { display: flex; }
    #empty-state .empty-symbol {
      font-family: 'Cinzel', serif; font-size: 4rem;
      color: rgba(193,120,23,0.3); margin-bottom: 1.5rem;
    }
    #empty-state p {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic; font-size: 1.2rem;
      color: var(--text-muted);
    }

    /* ── DOCK NAV ── */
    #dock {
      position: fixed; bottom: 2.5rem; left: 50%; transform: translateX(-50%);
      z-index: 100;
      display: flex; align-items: center; gap: 0;
      background: rgba(193,120,23,0.07);
      backdrop-filter: blur(30px);
      border: 1px solid rgba(193,120,23,0.25);
      border-radius: 60px;
      padding: 0;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }
    .dock-btn {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.85rem 1.4rem;
      font-family: 'Cinzel', serif;
      font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: rgba(244,232,208,0.6);
      background: transparent; border: none; cursor: none;
      transition: color 0.3s ease, background 0.3s ease;
      white-space: nowrap;
    }
    .dock-btn:hover { color: var(--text-date); background: rgba(193,120,23,0.1); }
    .dock-btn.active { color: var(--text-date); }
    .dock-sep { width: 1px; height: 20px; background: rgba(193,120,23,0.2); flex-shrink: 0; }
    .dock-icon { font-size: 0.8rem; }

    #year-filter-wrapper { position: relative; display: flex; align-items: center; }
    #yearFilter {
      appearance: none; background: transparent; border: none;
      font-family: 'Cinzel', serif; font-size: 0.6rem;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: rgba(244,232,208,0.6); cursor: none;
      padding: 0.85rem 1.8rem 0.85rem 1.4rem;
      transition: color 0.3s ease;
      outline: none;
    }
    #yearFilter:hover { color: var(--text-date); }
    #yearFilter option { background: #2a1f17; color: var(--text-main); }
    .year-arrow {
      position: absolute; right: 0.7rem;
      font-size: 0.5rem; color: rgba(193,120,23,0.5);
      pointer-events: none;
    }

    /* ── SEARCH OVERLAY ── */
    #search-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(28,20,16,0.98);
      backdrop-filter: blur(20px);
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start;
      padding: 4rem 2rem 2rem;
      opacity: 0; pointer-events: none;
      transition: opacity 0.5s ease;
    }
    #search-overlay.open { opacity: 1; pointer-events: all; }

    #search-close {
      position: absolute; top: 2rem; right: 2.5rem;
      font-family: 'Cinzel', serif; font-size: 0.65rem;
      letter-spacing: 0.3em; color: var(--text-muted);
      background: none; border: none; cursor: none;
      transition: color 0.3s ease;
      text-transform: uppercase;
    }
    #search-close:hover { color: var(--text-date); }

    .search-box {
      width: 100%; max-width: 800px;
      border: 1px solid rgba(193,120,23,0.3);
      padding: 1.2rem 1.8rem;
      display: flex; align-items: center; gap: 1rem;
      margin-top: 2rem; margin-bottom: 1.5rem;
    }
    .search-box input {
      flex: 1; background: transparent; border: none;
      font-family: 'Crimson Text', serif; font-size: 1.5rem;
      color: var(--text-main); outline: none;
      letter-spacing: 0.05em;
    }
    .search-box input::placeholder { color: var(--text-muted); }
    .search-box .search-icon { color: var(--accent-primary); font-size: 1.1rem; }

    #search-count {
      font-family: 'Cormorant Garamond', serif; font-style: italic;
      font-size: 0.9rem; color: var(--text-muted);
      margin-bottom: 2rem; letter-spacing: 0.1em;
      width: 100%; max-width: 800px;
    }

    #search-results {
      width: 100%; max-width: 800px;
      overflow-y: auto; flex: 1;
      display: flex; flex-direction: column; gap: 0.8rem;
    }
    .search-result-item {
      display: flex; gap: 1.2rem; align-items: flex-start;
      padding: 1.2rem;
      border: 1px solid rgba(193,120,23,0.12);
      background: rgba(255,255,255,0.015);
      cursor: none;
      transition: border-color 0.3s ease, background 0.3s ease;
    }
    .search-result-item:hover {
      border-color: rgba(193,120,23,0.4);
      background: rgba(255,255,255,0.03);
    }
    .search-result-date { flex-shrink: 0; }
    .search-result-date .mini-day {
      font-family: 'Cinzel', serif; font-size: 1.1rem; font-weight: 600;
      color: var(--text-date); line-height: 1;
    }
    .search-result-date .mini-mon {
      font-family: 'Cinzel', serif; font-size: 0.5rem; letter-spacing: 0.15em;
      color: var(--accent-primary); text-transform: uppercase;
    }
    .search-result-date .mini-yr {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.7rem; color: var(--text-muted);
    }
    .search-result-content { flex: 1; min-width: 0; }
    .search-result-title {
      font-family: 'Crimson Text', serif; font-size: 1rem; font-weight: 600;
      color: var(--text-main); margin-bottom: 0.3rem;
    }
    .search-result-snippet {
      font-family: 'Crimson Text', serif; font-style: italic;
      font-size: 0.85rem; color: var(--text-muted); line-height: 1.5;
    }
    .search-highlight { color: var(--text-date); font-style: normal; background: rgba(193,120,23,0.15); }

    /* ── READ MODAL ── */
    #read-modal {
      position: fixed; inset: 0; z-index: 150;
      background: var(--bg-main);
      opacity: 0; pointer-events: none;
      transition: opacity 0.7s ease;
      overflow-y: auto; overflow-x: hidden;
    }
    #read-modal.open { opacity: 1; pointer-events: all; }

    .modal-header {
      position: sticky; top: 0; z-index: 160;
      display: flex; align-items: center; justify-content: space-between;
      padding: 2rem 3rem;
      background: linear-gradient(to bottom, var(--bg-main) 70%, transparent);
    }
    #modal-back {
      font-family: 'Cinzel', serif; font-size: 0.6rem;
      letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--text-muted); background: none; border: none;
      cursor: none; transition: color 0.3s ease;
      display: flex; align-items: center; gap: 0.5rem;
    }
    #modal-back::before { content: '←'; }
    #modal-back:hover { color: var(--text-date); }

    #modal-nav { display: flex; gap: 1rem; }
    .modal-nav-btn {
      font-family: 'Cinzel', serif; font-size: 0.6rem;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--text-muted); background: rgba(193,120,23,0.08);
      border: 1px solid rgba(193,120,23,0.2);
      padding: 0.5rem 1rem; cursor: none;
      transition: color 0.3s ease, border-color 0.3s ease, background 0.3s ease;
    }
    .modal-nav-btn:hover {
      color: var(--text-date);
      border-color: rgba(193,120,23,0.5);
      background: rgba(193,120,23,0.15);
    }

    .modal-body {
      max-width: 65ch; margin: 0 auto;
      padding: 3rem 2rem 8rem;
      display: flex; flex-direction: column; align-items: center;
    }

    #modal-date-display {
      display: flex; flex-direction: column; align-items: center;
      border: 1px solid rgba(193,120,23,0.35);
      padding: 1rem 1.8rem; margin-bottom: 3rem;
      opacity: 0; transform: translateY(-20px);
      transition: opacity 0.8s ease 0.2s, transform 0.8s ease 0.2s;
    }
    #modal-date-display.revealed { opacity: 1; transform: none; }
    .modal-date-day {
      font-family: 'Cinzel', serif; font-size: 3.5rem; font-weight: 600;
      color: var(--text-date); line-height: 1;
    }
    .modal-date-month {
      font-family: 'Cinzel', serif; font-size: 0.8rem; font-weight: 400;
      letter-spacing: 0.3em; color: var(--accent-primary);
      text-transform: uppercase; margin-top: 0.3rem;
    }
    .modal-date-year {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.85rem; color: var(--text-muted); margin-top: 0.2rem;
      letter-spacing: 0.15em;
    }

    #modal-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.8rem, 4vw, 3.5rem); font-weight: 400;
      text-align: center; line-height: 1.25;
      color: var(--text-main); margin-bottom: 2rem;
      opacity: 0; transform: translateY(20px);
      transition: opacity 0.8s ease 0.4s, transform 0.8s ease 0.4s;
    }
    #modal-title.revealed { opacity: 1; transform: none; }

    .modal-ornament {
      width: 100%; display: flex; align-items: center; gap: 1rem;
      margin-bottom: 3rem;
      opacity: 0;
      transition: opacity 0.8s ease 0.6s;
    }
    .modal-ornament.revealed { opacity: 1; }
    .ornament-line { flex: 1; height: 1px; background: linear-gradient(to right, transparent, var(--accent-primary), transparent); opacity: 0.4; }
    .ornament-glyph { color: var(--accent-primary); font-size: 0.7rem; flex-shrink: 0; }

    #modal-text {
      font-family: 'Crimson Text', serif;
      font-size: clamp(1.1rem, 2vw, 1.45rem);
      line-height: 2.4;
      color: rgba(244,232,208,0.85);
      text-align: center;
      width: 100%;
      opacity: 0; transform: translateY(20px);
      transition: opacity 0.8s ease 0.7s, transform 0.8s ease 0.7s;
    }
    #modal-text.revealed { opacity: 1; transform: none; }
    #modal-text .stanza { margin-bottom: 2.5rem; }
    #modal-text .stanza:first-child .line:first-child::first-letter {
      font-family: 'Cinzel', serif;
      font-size: 3.2em; font-weight: 600;
      float: left; line-height: 0.8;
      margin-right: 0.1em; margin-top: 0.15em;
      color: var(--accent-primary);
    }
    #modal-text .line { display: block; }

    .modal-actions {
      display: flex; align-items: center; gap: 1.5rem;
      margin-top: 4rem;
      opacity: 0;
      transition: opacity 0.8s ease 1s;
    }
    .modal-actions.revealed { opacity: 1; }
    .modal-action-btn {
      display: flex; align-items: center; gap: 0.5rem;
      font-family: 'Cinzel', serif; font-size: 0.6rem;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--text-muted);
      background: rgba(193,120,23,0.06);
      border: 1px solid rgba(193,120,23,0.2);
      padding: 0.7rem 1.2rem; cursor: none;
      transition: color 0.3s ease, border-color 0.3s ease;
    }
    .modal-action-btn:hover { color: var(--text-date); border-color: rgba(193,120,23,0.5); }
    .modal-action-btn.saved { color: var(--text-date); border-color: rgba(193,120,23,0.5); }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      header { padding: 1.5rem; }
      main { padding: 8rem 1rem 8rem; }
      #poems-grid { grid-template-columns: 1fr; gap: 1.2rem; }
      #dock { width: 92%; bottom: 1.5rem; }
      .dock-btn { padding: 0.75rem 0.9rem; font-size: 0.55rem; }
      #yearFilter { padding: 0.75rem 1.5rem 0.75rem 0.9rem; font-size: 0.55rem; }
      .modal-header { padding: 1.5rem; }
      .modal-body { padding: 2rem 1.5rem 6rem; }
      #modal-text { text-align: left; }
      #modal-title { font-size: 1.6rem; }
      .modal-date-day { font-size: 2.5rem; }
      #modal-nav { display: none; }
    }
  </style>
</head>
<body>

  <div class="noise"></div>
  <div class="ambient"><div class="ambient-1"></div><div class="ambient-2"></div><div class="ambient-3"></div></div>

  <div id="custom-cursor"></div>

  <!-- HEADER -->
  <header>
    <div class="header-brand">
      <div class="header-author" id="header-author">Jaloliddin Komolov</div>
      <div class="header-collection" id="header-collection">Inson · Сборник</div>
    </div>
    <div class="header-stats">
      <span class="read-icon">◈</span>
      <span id="read-counter">0 / 0 o'qildi</span>
    </div>
  </header>

  <!-- MAIN -->
  <main>
    <section id="poems-grid"></section>
    <div id="empty-state">
      <div class="empty-symbol">◆</div>
      <p>Bu makonda hech narsa topilmadi</p>
    </div>
  </main>

  <!-- DOCK -->
  <nav id="dock">
    <button class="dock-btn" id="search-open-btn">
      <span class="dock-icon">⌕</span> Qidirish
    </button>
    <div class="dock-sep"></div>
    <div id="year-filter-wrapper">
      <select id="yearFilter">
        <option value="all">Barcha yillar</option>
      </select>
      <span class="year-arrow">▾</span>
    </div>
    <div class="dock-sep"></div>
    <button class="dock-btn" id="sort-btn">
      <span class="dock-icon">↕</span> <span id="sort-label">Yangi</span>
    </button>
    <div class="dock-sep"></div>
    <button class="dock-btn" id="random-btn">
      <span class="dock-icon">⚄</span>
    </button>
  </nav>

  <!-- SEARCH OVERLAY -->
  <div id="search-overlay">
    <button id="search-close">Yopish ✕</button>
    <div class="search-box">
      <span class="search-icon">⌕</span>
      <input type="text" id="search-input" placeholder="She'r qidirish..." autocomplete="off" spellcheck="false">
    </div>
    <div id="search-count"></div>
    <div id="search-results"></div>
  </div>

  <!-- READ MODAL -->
  <article id="read-modal">
    <div class="modal-header">
      <button id="modal-back">Orqaga</button>
      <div id="modal-nav">
        <button class="modal-nav-btn" id="prev-poem">← Oldingi</button>
        <button class="modal-nav-btn" id="next-poem">Keyingi →</button>
      </div>
    </div>
    <div class="modal-body">
      <div id="modal-date-display">
        <div class="modal-date-day" id="mday"></div>
        <div class="modal-date-month" id="mmon"></div>
        <div class="modal-date-year" id="myr"></div>
      </div>
      <h2 id="modal-title"></h2>
      <div class="modal-ornament" id="modal-ornament">
        <div class="ornament-line"></div>
        <span class="ornament-glyph">✦</span>
        <div class="ornament-line"></div>
      </div>
      <div id="modal-text"></div>
      <div class="modal-actions" id="modal-actions">
        <button class="modal-action-btn" id="save-btn">♡ Saqlash</button>
        <button class="modal-action-btn" id="share-btn">↗ Ulashish</button>
      </div>
    </div>
  </article>

  <script>
  // ── DATA ──
  const rawData = [{
    "сборник": { "название": "Inson", "автор": "Jaloliddin Komolov" },
    "стихи": [
      { "дата": "08.08.2023", "текст": "Hayotim qiziq, bilaman o'zim,\nKimga foyda, kimga esa kerakmas so'zim.\n\nAmmo yashayabman — men ham bir inson,\nDunyoda bor ekan mening ham o'rnim.\n\nDinim — Islomdir, kitobim — Qur'on,\nRasulimga doim aytaman salom.\n\nHayotda yashayman har lahza, har on,\nOrzularim, hayollarim — bisyor bir dunyo." },
      { "дата": "10.08.2023", "текст": "Vaziyat og'irlashmoqda\nSoat yaqinlashmoqda\nO'yin-kulgu orqada\nQolib hayrlashmoqda.\n\nKunduz tugamay turib,\nTunni kutib olyabmiz.\nYoruq, nurli kunlarni\nBiz yo'qotib boryabmiz." },
      { "дата": "15.12.2023", "текст": "Ilhom keldi — so'zlarni yozdim,\nAyni shu dam aqldan ozdim.\n\nMen insonman, odam bolasi,\nNahotki men orqada qoldim?\n\nRasululloh ummati,\ndavom etay, Sunnati.\n\nRobbim, bizni kechirsin\nRohim ismi hurmati.\n\nRahmat, Robbim, Senga shukurlar,\nYodga solding O'zingni.\n\nErta kundan boshlayman —\nYodlayman har so'zingni." },
      { "дата": "19.12.2023", "текст": "Odamlarni ko'rdim yoshlari katta,\nLekin ma'nosi yo'q, hayot g'aflatda.\nKuni tuni o'tar mehnat mashaqqatda,\nMantiqsiz hayot, nima maqsadda?" },
      { "дата": "10.03.2024", "текст": "Maftun ko'zlarga mahliyo bo'lib\nMahkum bo'ldim mudom termulib,\nOy kabi nurli bu yuzni ko'rib\nSevdimmi bilmadim, lek sevinib qo'ydim.\n\nSabab tosh oynada o'zimni ko'rdim)" },
      { "дата": "18.03.2024", "текст": "Qaddingni tik tut,\nO'zingni o'ngla,\n\nRuhingni tushurma,\nDoim rost so'zla.\n\nIbrohim hayosin,\nAllohdan so'ra,\n\nHar bir qilayotgan\nishingni o'yla." },
      { "дата": "11.04.2024", "текст": "Hatm kuni yoshlandi ko'zim,\nRobbim uchun boshlandi tazim.\nToqatim yetgancha qildim toatim,\nTamoman Robbim tomon yuzlandim." },
      { "дата": "11.04.2024", "текст": "She'r yozay deyman,\nQo'lim yozmaydi,\nQalbimdagi so'zlar\nTilga bormaydi.\n\nHolatmi shu,\nEshit ey do'stim,\nMeni sendan boshqa\nHech kim ko'rmaydi." },
      { "дата": "03.09.2024", "текст": "Ishim ko'p deb boshim qotadi,\nKunlar sanab oylar o'tadi.\nHaq aytarkan yoshi kattalar —\nIsh tugamas, umr ketadi." },
      { "дата": "26.10.2024", "текст": "Kun-u tunlar doim bedorman.\nBilmam, balki xasta bemorman.\nHolim so'rab kelgan qavmimga\nSo'zlarim zo'r, yaxshi mezbonman.\nNe qilsam ham oddiy insonman.\n\nOilam uchun ishonchli posbon,\nMen ularga to'g'on, qalqonman.\nQuduqdan suv kerak bo'lsa,\nChelak uchun uzun arqonman.\nNe qilsam ham oddiy insonman.\n\nDo'stlarim bor, haqda sobit,\nTo'g'ri qo'ygan mezonlarini.\nGuvohman-ki, bari obid,\nMen ularga tirik isbotman.\nNe qilsam ham oddiy insonman.\n\nHayotimda uchragan yorim,\nNasib qilsa bo'lar ayolim,\nDoim mendan so'raydi holim,\nMen u uchun yagona inson,\nNe qilsam ham oddiy insonman.\n\nJamoat ichida bir sanoq son,\nOdam uchun nevara inson.\nVaqti kelganda beruvchiman jon,\nHamma uchun oddiy insonman." },
      { "дата": "16.11.2024", "текст": "Bilib turib qilyabman gunoh,\nVijdon azob beryabdi, Alloh.\nSen dunyoda yagona podshoh,\nQuling uchun bergin bir panoh.\n\nBelgi berding, \"to'xtat so'zingni\",\nBoshqa bosma, yo'qot izingni.\nQilolmadim aytgan amringni —\nVijdon azob beryabdi, Alloh.\n\nYolg'on bo'lsa, uzgin arqonni,\nO'rtamizga qo'ygin qalqonni.\nTil ostiga to'ldir talqonni —\nNafsim zulm qilyabdi, Alloh.\n\nHolim harob bo'lyabdi, Alloh,\nNahot sarob ko'ryabman, Iloh.\nUmr ozdir, bildirding O'zing,\nQonun menga aytgan har so'zing" },
      { "дата": "05.07.2025", "текст": "Qiyomat ko'zlarni ochgan lahzada\nMunofiq kofirlar qayg'uga botar\nDo'stim shu Kun seni topaman\nOz vaqt qoldi, qadar... bu qadar...\n\nAzroil rahimsiz muhlat bermaydi\nNavbat kelsa to'xtamas qaytmas\nBeruvchi Rabbim, jon omonati\nOlguvchi ham o'zi, qadar... bu qadar...\n\nShohmi u yo g'arib bari ketadi\nSo'ngi so'zin oxir aytadi\n\"Inson\" senga bersin Sabrun Jamil\nQabul qilgin qadar... bu qadar..." },
      { "дата": "03.09.2025", "текст": "Yo'lim olis, chuqurlar ko'p,\nQo'limdadir kichik bir sham.\n\nOlovining mitti nuri,\nYoritadi yo'lni har dam.\n\nO'zi nozik, so'nar zumda,\nAsrash kerak shabbodadan." },
      { "дата": "26.09.2025", "текст": "So'zlay desak minglab so'zlar,\nLek bir jumla tuzolmadik\nDo'stim o'rning bilindi ko'p\nBiror malham topolmadik\n\nYodga keldi ajib damlar\nHar bir joyda xotiralar\nShunday ekan biz ojizmiz\nQadar deymiz xotir aylab\n\nXavotir yo'q xotirjammiz\nKo'ngil sezar biz bilamiz\nVaqt o'tadi muddat aniq\nOxir diydor ko'rishamiz" },
      { "дата": "27.09.2025", "текст": "She'r yozishda mohir emasman,\nQalamim yozar goho bir nelar.\nNe yozsam ham, o'qigan inson\nHikmat topsin, o'ylansin, deyman.\n\nShe'riy satrlar ajib chiroyli,\nBa'zan sirlar aytilar unda.\nShoshma, to'xta, chuqur nafas ol,\nQayta o'qi — toparsan shunda.\n\nShe'r ham balki qadar misoli,\nYozilgandir qalb kitobida.\nVaqti kelsa, siyohga sizib,\nSuriladi nomai a'moliga." },
      { "дата": "03.10.2025", "текст": "Dunyo ko'rdi toshbaqa, maqsad sari talpinar,\nManzil aniq bo'lsa-da, taqdir uni hal qilar.\nChetdan ko'rsang, mushkulmas — daqiqalar kifoya,\nLekin toshbaqa ko'zida, butkul boshqa hikoya." },
      { "дата": "23.10.2025", "текст": "har bir kunning soni aniq\nhar bir kuning soni aniq\nhar bir kundan so'rar aniq\nhar bir kunga hokim Holiq" },
      { "дата": "23.10.2025", "текст": "Jamiyat johil — ko'plar g'avg'oda,\nG'arib qalblar, dardi dunyoda.\nDaromadi to'lsa karmonda,\nG'ofil dili — lek kuni savdoda.\n\nOqil inson, maqsadi sonmi?\nShu sonlari ko'paysa — hayot gulzormi?\nZohiran zo'r, botin marommi?\nMudom o'yla — maqsad matomi?\n\nDarhaqiqat, unutma haqni,\nAlmisog'da aytilgan ahdni.\nNasib o'ngdan olursan xatni,\nShunday ekan, qadrla vaqtni.\n\nKo'p odamzot sonlar quvladi,\nTunlar bedor, tongda mudradi.\nMudroq tutdi — haqni ko'rmadi,\nSon tugamas, umr tugadi.\n\nMahzun bo'lma, satrlar keskin,\nKeraksiz yuklaring ipini kesgin.\nShe'r ma'nosin qalb ila sezgin,\nJumla yakun — sakinat sezgin." },
      { "дата": "24.10.2025", "текст": "Nechun yozmam sevgi haqida,\nBarcha shoir oshiq aslida.\nUl xushhidli gulning vaslida —\nSiyohdonning qalami namdir.\n\nHis qilishla totguvchisan ta'm,\nOz-oz misli asaldir malham.\nO'ng qo'ldagi yozuvchi qalam,\nYozar goho bu mavzuda ham." },
      { "дата": "27.10.2025", "текст": "Dunyo bo'lsa dasturxon,\nXon kursidan kuzatar.\nNeni istasa inson,\nXon xohlasa uzatar.\n\nBa'zan inson o'ylanar —\nLoyiqmikan ushoqqa?\nXon aytadi: \"Qo'l uzat,\nGo'sht kesuvchi pichoqqa.\"\n\nDasturxon to'la ne'mat,\nBeruvchi — oliy himmat.\nOlursan, aytib: \"Rahmat\",\nBadal bo'lur itoat." },
      { "дата": "27.10.2025", "текст": "Changalda cho'g' ushlash zamoni,\nHavotirlan — nuring omonmi?\nAjratolmay yaxshi-yomonni,\nKo'rayapsan foyda, ziyonni." }
    ]
  }];

  // ── MONTH NAMES ──
  const MONTHS_UZ = ['YAN','FEV','MAR','APR','MAY','IYU','IYL','AVG','SEN','OKT','NOY','DES'];

  // ── STATE ──
  let poems = [];
  let filteredPoems = [];
  let currentSort = 'desc';
  let currentYear = 'all';
  let searchQuery = '';
  let currentPoemIndex = -1;
  let readPoems = new Set(JSON.parse(localStorage.getItem('readPoems') || '[]'));
  let savedPoems = new Set(JSON.parse(localStorage.getItem('savedPoems') || '[]'));

  // ── PARSE ──
  function parse() {
    const coll = rawData[0]['сборник'];
    document.getElementById('header-author').textContent = coll['автор'];
    document.getElementById('header-collection').textContent = coll['название'] + ' · Она\'т';

    poems = rawData[0]['стихи'].map((p, i) => {
      const lines = p['текст'].trim().split('\n');
      const title = lines[0].replace(/[,\.!?)\(]$/, '');
      const [d, m, y] = p['дата'].split('.');
      return {
        id: i,
        title,
        text: p['текст'],
        dateStr: p['дата'],
        day: d, month: m, year: y,
        monthName: MONTHS_UZ[parseInt(m)-1],
        ts: new Date(y, m-1, d).getTime(),
        preview: lines.slice(0,3).join('\n'),
      };
    });

    // year filter
    const sel = document.getElementById('yearFilter');
    [...new Set(poems.map(p => p.year))].sort((a,b) => b-a).forEach(yr => {
      const o = document.createElement('option');
      o.value = yr; o.textContent = yr;
      sel.appendChild(o);
    });

    updateReadCounter();
  }

  function updateReadCounter() {
    const el = document.getElementById('read-counter');
    el.textContent = `${readPoems.size} / ${poems.length} o'qildi`;
  }

  // ── FILTER & SORT ──
  function getFiltered() {
    let arr = poems.filter(p => {
      const q = searchQuery.toLowerCase();
      const matchSearch = !q || p.text.toLowerCase().includes(q) || p.title.toLowerCase().includes(q);
      const matchYear = currentYear === 'all' || p.year === currentYear;
      return matchSearch && matchYear;
    });
    arr.sort((a,b) => currentSort === 'desc' ? b.ts - a.ts : a.ts - b.ts);
    return arr;
  }

  // ── RENDER GRID ──
  function renderGrid() {
    filteredPoems = getFiltered();
    const grid = document.getElementById('poems-grid');
    const empty = document.getElementById('empty-state');
    grid.innerHTML = '';

    if (!filteredPoems.length) {
      empty.classList.add('visible');
      return;
    }
    empty.classList.remove('visible');

    filteredPoems.forEach((poem, idx) => {
      const card = document.createElement('article');
      card.className = 'poem-card';
      card.dataset.id = poem.id;

      const preview = poem.preview.replace(/\n/g, '<br>');

      card.innerHTML = `
        <span class="card-ornament">✦</span>
        <div class="date-block">
          <div class="date-day">${poem.day}</div>
          <div class="date-month">${poem.monthName}</div>
          <div class="date-year">${poem.year}</div>
        </div>
        <h3 class="card-title">${poem.title}</h3>
        <div class="card-divider"></div>
        <div class="card-preview">${preview}</div>
        <div class="card-read-btn">O'qish</div>
      `;
      card.addEventListener('click', () => openModal(poem, idx));
      grid.appendChild(card);
    });

    // staggered reveal with IntersectionObserver
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const card = entry.target;
          const i = [...grid.children].indexOf(card);
          setTimeout(() => card.classList.add('visible'), i * 120);
          observer.unobserve(card);
        }
      });
    }, { threshold: 0.05 });

    [...grid.querySelectorAll('.poem-card')].forEach(c => observer.observe(c));
  }

  // ── MODAL ──
  function openModal(poem, filteredIdx) {
    currentPoemIndex = filteredIdx;
    fillModal(poem);
    const modal = document.getElementById('read-modal');
    modal.scrollTop = 0;
    modal.classList.add('open');
    document.body.style.overflow = 'hidden';

    // mark read
    readPoems.add(poem.id);
    localStorage.setItem('readPoems', JSON.stringify([...readPoems]));
    updateReadCounter();

    // reveal elements
    setTimeout(() => {
      document.getElementById('modal-date-display').classList.add('revealed');
      document.getElementById('modal-title').classList.add('revealed');
      document.getElementById('modal-ornament').classList.add('revealed');
      document.getElementById('modal-text').classList.add('revealed');
      document.getElementById('modal-actions').classList.add('revealed');
    }, 80);

    // save btn state
    const saveBtn = document.getElementById('save-btn');
    saveBtn.textContent = savedPoems.has(poem.id) ? '♥ Saqlangan' : '♡ Saqlash';
    saveBtn.classList.toggle('saved', savedPoems.has(poem.id));
    saveBtn.onclick = () => {
      if (savedPoems.has(poem.id)) { savedPoems.delete(poem.id); saveBtn.textContent = '♡ Saqlash'; saveBtn.classList.remove('saved'); }
      else { savedPoems.add(poem.id); saveBtn.textContent = '♥ Saqlangan'; saveBtn.classList.add('saved'); }
      localStorage.setItem('savedPoems', JSON.stringify([...savedPoems]));
    };
    document.getElementById('share-btn').onclick = () => {
      if (navigator.share) { navigator.share({ title: poem.title, text: poem.text }); }
      else if (navigator.clipboard) { navigator.clipboard.writeText(poem.title + '\n\n' + poem.text); }
    };
  }

  function fillModal(poem) {
    document.getElementById('mday').textContent = poem.day;
    document.getElementById('mmon').textContent = poem.monthName + ' ' + poem.year;
    document.getElementById('myr').textContent = poem.dateStr;
    document.getElementById('modal-title').textContent = poem.title;

    // reset animation states
    ['modal-date-display','modal-title','modal-ornament','modal-text','modal-actions'].forEach(id => {
      document.getElementById(id).classList.remove('revealed');
    });

    // render stanzas
    const stanzas = poem.text.split(/\n\n+/);
    const textEl = document.getElementById('modal-text');
    textEl.innerHTML = stanzas.map(stanza => {
      const lines = stanza.split('\n').map(l => `<span class="line">${l}</span>`).join('');
      return `<div class="stanza">${lines}</div>`;
    }).join('');
  }

  function closeModal() {
    const modal = document.getElementById('read-modal');
    ['modal-date-display','modal-title','modal-ornament','modal-text','modal-actions'].forEach(id => {
      document.getElementById(id).classList.remove('revealed');
    });
    setTimeout(() => {
      modal.classList.remove('open');
      document.body.style.overflow = '';
    }, 600);
  }

  function navigateModal(dir) {
    const newIdx = currentPoemIndex + dir;
    if (newIdx < 0 || newIdx >= filteredPoems.length) return;
    currentPoemIndex = newIdx;
    const poem = filteredPoems[newIdx];
    fillModal(poem);
    document.getElementById('read-modal').scrollTop = 0;
    setTimeout(() => {
      document.getElementById('modal-date-display').classList.add('revealed');
      document.getElementById('modal-title').classList.add('revealed');
      document.getElementById('modal-ornament').classList.add('revealed');
      document.getElementById('modal-text').classList.add('revealed');
      document.getElementById('modal-actions').classList.add('revealed');
    }, 80);

    readPoems.add(poem.id);
    localStorage.setItem('readPoems', JSON.stringify([...readPoems]));
    updateReadCounter();
  }

  // ── SEARCH ──
  let searchDebounce;
  function renderSearchResults(q) {
    const results = document.getElementById('search-results');
    const count = document.getElementById('search-count');
    results.innerHTML = '';
    if (!q.trim()) { count.textContent = ''; return; }

    const matches = poems.filter(p =>
      p.text.toLowerCase().includes(q.toLowerCase()) || p.title.toLowerCase().includes(q.toLowerCase())
    );
    count.textContent = `${matches.length} ta she'r topildi`;

    matches.forEach(poem => {
      const item = document.createElement('div');
      item.className = 'search-result-item';

      const snippet = (() => {
        const idx = poem.text.toLowerCase().indexOf(q.toLowerCase());
        if (idx < 0) return poem.preview;
        const start = Math.max(0, idx-30);
        const end = Math.min(poem.text.length, idx+q.length+50);
        const raw = poem.text.slice(start, end).replace(/\n/g, ' ');
        return raw.replace(new RegExp(q, 'gi'), m => `<mark class="search-highlight">${m}</mark>`);
      })();

      item.innerHTML = `
        <div class="search-result-date">
          <div class="mini-day">${poem.day}</div>
          <div class="mini-mon">${poem.monthName}</div>
          <div class="mini-yr">${poem.year}</div>
        </div>
        <div class="search-result-content">
          <div class="search-result-title">${poem.title}</div>
          <div class="search-result-snippet">...${snippet}...</div>
        </div>`;
      item.addEventListener('click', () => {
        closeSearch();
        const fi = filteredPoems.findIndex(p => p.id === poem.id);
        openModal(poem, fi >= 0 ? fi : 0);
      });
      results.appendChild(item);
    });
  }

  function openSearch() {
    document.getElementById('search-overlay').classList.add('open');
    setTimeout(() => document.getElementById('search-input').focus(), 100);
  }
  function closeSearch() {
    document.getElementById('search-overlay').classList.remove('open');
  }

  // ── CUSTOM CURSOR ──
  const cur = document.getElementById('custom-cursor');
  let cx = 0, cy = 0, tx = 0, ty = 0;
  if (window.matchMedia('(pointer: fine)').matches) {
    document.addEventListener('mousemove', e => { tx = e.clientX; ty = e.clientY; });
    const animCursor = () => {
      cx += (tx - cx) * 0.15;
      cy += (ty - cy) * 0.15;
      cur.style.left = cx + 'px';
      cur.style.top = cy + 'px';
      requestAnimationFrame(animCursor);
    };
    animCursor();
    document.addEventListener('mouseover', e => {
      const interactable = e.target.closest('button, a, select, input, .poem-card, .search-result-item, .modal-nav-btn');
      cur.classList.toggle('expanded', !!interactable);
    });
  }

  // ── SWIPE SUPPORT ──
  let touchStartX = 0;
  document.getElementById('read-modal').addEventListener('touchstart', e => {
    touchStartX = e.changedTouches[0].screenX;
  }, { passive: true });
  document.getElementById('read-modal').addEventListener('touchend', e => {
    const dx = e.changedTouches[0].screenX - touchStartX;
    if (Math.abs(dx) > 60) navigateModal(dx < 0 ? 1 : -1);
  }, { passive: true });

  // ── EVENT LISTENERS ──
  document.addEventListener('DOMContentLoaded', () => {
    parse();
    renderGrid();

    document.getElementById('search-open-btn').addEventListener('click', openSearch);
    document.getElementById('search-close').addEventListener('click', closeSearch);
    document.getElementById('search-input').addEventListener('input', e => {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(() => renderSearchResults(e.target.value), 250);
    });

    document.getElementById('yearFilter').addEventListener('change', e => {
      currentYear = e.target.value; renderGrid();
    });

    document.getElementById('sort-btn').addEventListener('click', () => {
      currentSort = currentSort === 'desc' ? 'asc' : 'desc';
      document.getElementById('sort-label').textContent = currentSort === 'desc' ? 'Yangi' : 'Eski';
      renderGrid();
    });

    document.getElementById('random-btn').addEventListener('click', () => {
      const r = Math.floor(Math.random() * poems.length);
      const fi = filteredPoems.findIndex(p => p.id === poems[r].id);
      openModal(poems[r], fi >= 0 ? fi : 0);
    });

    document.getElementById('modal-back').addEventListener('click', closeModal);
    document.getElementById('prev-poem').addEventListener('click', () => navigateModal(-1));
    document.getElementById('next-poem').addEventListener('click', () => navigateModal(1));

    document.addEventListener('keydown', e => {
      const modalOpen = document.getElementById('read-modal').classList.contains('open');
      const searchOpen = document.getElementById('search-overlay').classList.contains('open');
      if (e.key === 'Escape') { if (modalOpen) closeModal(); if (searchOpen) closeSearch(); }
      if (modalOpen) {
        if (e.key === 'ArrowLeft') navigateModal(-1);
        if (e.key === 'ArrowRight') navigateModal(1);
      }
    });
  });
  </script>
</body>
</html>
