<!DOCTYPE html>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cg fill='none' stroke='%231b6a78' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M24 3 L36 26 L31 37 L17 37 L12 26 Z'/%3E%3Cline x1='24' y1='3' x2='24' y2='23'/%3E%3Crect x='17' y='37' width='14' height='8' rx='1'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }

<title>Inson</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Spectral:ital,wght@0,300;0,400;0,500;1,300;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: a book. Cover + mundarija (contents) on one page, each poem on its own page (#sher-N). Single narrow reading column. */
  :root {
    --paper: #eceee8;
    --paper-2: #e2e5de;
    --ink: #1d2740;
    --ink-soft: #4d5670;
    --muted: #7f8697;
    --rule: #c9cdc4;
    --lapis: #1b6a78;
    --lapis-wash: rgba(27,106,120,.10);
    --f-display: "Marcellus", "Times New Roman", serif;
    --f-body: "Spectral", Georgia, "Times New Roman", serif;
    --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #121620; --paper-2: #1a1f2b; --ink: #dfe4ea; --ink-soft: #aab2c0;
      --muted: #737c8d; --rule: #2b3241; --lapis: #62b8c4; --lapis-wash: rgba(98,184,196,.12);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #121620; --paper-2: #1a1f2b; --ink: #dfe4ea; --ink-soft: #aab2c0;
    --muted: #737c8d; --rule: #2b3241; --lapis: #62b8c4; --lapis-wash: rgba(98,184,196,.12);
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; overflow-x: clip; }
  body { overflow-x: clip; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: var(--f-body); font-size: 18px; line-height: 1.6;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
    z-index: 10; background: var(--paper);
  }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--lapis); outline-offset: 3px; border-radius: 2px; }

  .wrap { max-width: 38rem; margin: 0 auto; }
  .view { animation: in .45s ease both; }
  @keyframes in { from { opacity: .0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .view { animation: none; } html { scroll-behavior: auto; } }

  .eyebrow {
    font-family: var(--f-mono); font-size: .72rem; letter-spacing: .14em;
    text-transform: uppercase; color: var(--muted);
  }

  /* ── COVER ── */
  .cover { padding-block: 4.5rem 3rem; display: grid; gap: 1.4rem; justify-items: start; position: relative; isolation: isolate; }
  .cover > :not(.wind) { position: relative; z-index: 1; }
  .wind {
    position: absolute; top: 0; bottom: 0; left: 50%; width: 100vw; margin-left: -50vw;
    z-index: 0; pointer-events: none; display: block;
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 12%, #000 80%, transparent);
    mask-image: linear-gradient(to bottom, transparent, #000 12%, #000 80%, transparent);
  }
  .star { width: 44px; height: 44px; color: var(--lapis); }
  .cover h1 {
    font-family: var(--f-display); font-weight: 400;
    font-size: clamp(4.2rem, 19vw, 7.5rem); line-height: .9; letter-spacing: .02em;
    margin: 0; text-wrap: balance;
  }
  .cover .author { font-family: var(--f-display); font-size: 1.25rem; letter-spacing: .12em; text-transform: uppercase; margin: 0; }
  .cover .meta { display: flex; flex-wrap: wrap; gap: .4rem 1.4rem; }
  .epigraph {
    margin: .8rem 0 0; padding-left: 1rem; border-left: 2px solid var(--lapis);
    font-style: italic; font-weight: 300; color: var(--ink-soft); line-height: 1.7;
  }
  .epigraph cite { display: block; margin-top: .3rem; font-style: normal; font-family: var(--f-mono); font-size: .7rem; letter-spacing: .1em; color: var(--muted); }
  .cover-actions { display: flex; flex-wrap: wrap; gap: .7rem; margin-top: .6rem; }
  .btn {
    display: inline-flex; align-items: center; gap: .5rem;
    font-family: var(--f-mono); font-size: .78rem; letter-spacing: .06em;
    padding: .7rem 1.1rem; border: 1px solid var(--ink); background: transparent;
    text-decoration: none; cursor: pointer; border-radius: 2px;
    transition: background .2s, color .2s;
  }
  .btn.solid { background: var(--ink); color: var(--paper); }
  .btn:hover { background: var(--ink); color: var(--paper); }
  .btn.solid:hover { background: var(--lapis); border-color: var(--lapis); }

  /* ── CONTENTS ── */
  .contents { padding-block: 1rem 3rem; border-top: 1px solid var(--rule); }
  .contents-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; padding-top: 2rem; }
  .contents-head h2 { font-family: var(--f-display); font-weight: 400; font-size: 1.7rem; margin: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: .45rem; margin: 1.2rem 0 .6rem; }
  .chip {
    font-family: var(--f-mono); font-size: .72rem; letter-spacing: .04em;
    padding: .38rem .75rem; border: 1px solid var(--rule); background: transparent;
    border-radius: 999px; cursor: pointer; color: var(--ink-soft);
    transition: border-color .2s, background .2s, color .2s;
  }
  .chip:hover { border-color: var(--ink-soft); color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .chip .n { opacity: .6; margin-left: .25rem; }

  .year { margin-top: 2rem; }
  .year h3 {
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: var(--f-display); font-weight: 400; font-size: 1.15rem; margin: 0 0 .4rem;
    padding-bottom: .4rem; border-bottom: 1px solid var(--rule);
  }
  .year h3 span { font-family: var(--f-mono); font-size: .7rem; color: var(--muted); letter-spacing: .08em; }
  .rows { list-style: none; margin: 0; padding: 0; }
  .row {
    display: flex; align-items: baseline; gap: .7rem;
    padding: .62rem 0; text-decoration: none; position: relative;
  }
  .row .no {
    font-family: var(--f-mono); font-size: .75rem; color: var(--muted);
    min-width: 1.6rem; font-variant-numeric: tabular-nums; position: relative;
  }
  .row.read .no::after {
    content: ""; position: absolute; left: -.75rem; top: .45em;
    width: 5px; height: 5px; border-radius: 50%; background: var(--lapis);
  }
  .row .first { min-width: 0; font-size: 1.05rem; transition: color .2s; }
  .row .lead { flex: 1 1 1.5rem; min-width: 1rem; border-bottom: 1px dotted var(--rule); transform: translateY(-.3em); }
  .row .date { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row .saved { color: var(--lapis); font-size: .8rem; }
  .row:hover .first { color: var(--lapis); }
  .empty { color: var(--muted); font-style: italic; padding: 2rem 0; }

  .about { border-top: 1px solid var(--rule); padding-block: 2rem 4rem; color: var(--ink-soft); font-size: 1rem; }
  .about h2 { font-family: var(--f-display); font-weight: 400; font-size: 1.2rem; color: var(--ink); margin: 0 0 .6rem; }
  .about p { margin: 0 0 .7rem; max-width: 34rem; }

  /* ── POEM PAGE ── */
  .bar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: var(--paper);
    display: flex; justify-content: space-between; align-items: center; gap: 1rem;
    padding-block: .9rem; border-bottom: 1px solid var(--rule);
  }
  .bar a { font-family: var(--f-mono); font-size: .78rem; letter-spacing: .06em; text-decoration: none; color: var(--ink-soft); }
  .bar a:hover { color: var(--lapis); }
  .bar .pos { font-family: var(--f-mono); font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }

  .poem { padding-block: 3rem 2rem; }
  .poem-head { display: grid; gap: .5rem; margin-bottom: 2.4rem; }
  .poem-head .big {
    font-family: var(--f-display); font-size: clamp(3.4rem, 14vw, 5rem); line-height: 1;
    color: var(--lapis); font-variant-numeric: tabular-nums;
  }
  .poem-head .asterism { font-family: var(--f-display); letter-spacing: .6em; color: var(--muted); }
  .tags { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .3rem; }
  .tag {
    font-family: var(--f-mono); font-size: .68rem; letter-spacing: .04em;
    padding: .25rem .6rem; border-radius: 999px; background: var(--lapis-wash); color: var(--lapis);
    border: none; cursor: pointer;
  }
  .tag:hover { text-decoration: underline; }

  .text { font-size: clamp(1.12rem, 3.6vw, 1.32rem); line-height: 1.85; font-weight: 400; }
  .stanza { margin: 0 0 1.6em; }
  .line { display: block; padding-left: 1.4em; text-indent: -1.4em; }

  .actions { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 2.4rem; padding-top: 1.6rem; border-top: 1px solid var(--rule); }
  .actions .btn[aria-pressed="true"] { background: var(--lapis); border-color: var(--lapis); color: var(--paper); }
  .note { font-family: var(--f-mono); font-size: .72rem; color: var(--lapis); min-height: 1.2em; margin-top: .6rem; }

  .pager { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; padding-block: 2rem 4rem; }
  .pager a {
    display: grid; gap: .3rem; text-decoration: none; padding: 1rem;
    border: 1px solid var(--rule); border-radius: 2px; min-width: 0;
    transition: border-color .2s, background .2s;
  }
  .pager a:hover { border-color: var(--lapis); background: var(--lapis-wash); }
  .pager a.next { text-align: right; }
  .pager .t { font-style: italic; font-size: .98rem; overflow-wrap: anywhere; }
  .pager .ghost { visibility: hidden; }
  .hint { text-align: center; font-family: var(--f-mono); font-size: .68rem; color: var(--muted); padding-bottom: 2rem; }

  @media (max-width: 480px) {
    body { font-size: 17px; }
    .cover { padding-block: 3rem 2rem; }
    .pager { grid-template-columns: 1fr; }
    .pager a.next { text-align: left; }
    .row .first { font-size: 1rem; }
  }
</style>
</head>

  <symbol id="star" viewBox="0 0 48 48">

      <path d="M24 3 L36 26 L31 37 L17 37 L12 26 Z"/>
      <line x1="24" y1="3" x2="24" y2="23"/>

      <rect x="17" y="37" width="14" height="8" rx="1"/>
    </g>
  </symbol>
</svg>

<script>
const BOOK = { title: "Inson", author: "Jaloliddin Komolov" };

const THEMES = {
  iymon:   "Iymon",
  inson:   "Inson",
  qadar:   "Qadar",
  vaqt:    "Vaqt",
  sevgi:   "Sevgi",
  jamiyat: "Jamiyat",
  sher:    "She'r haqida"
};

const POEMS = [
  { d: "08.08.2023", th: ["inson","iymon"], text: "Hayotim qiziq, bilaman o'zim,\nKimga foyda, kimga esa kerakmas so'zim.\n\nAmmo yashayabman — men ham bir inson,\nDunyoda bor ekan mening ham o'rnim.\n\nDinim — Islomdir, kitobim — Qur'on,\nRasulimga doim aytaman salom.\n\nHayotda yashayman har lahza, har on,\nOrzularim, hayollarim — bisyor bir dunyo." },
  { d: "10.08.2023", th: ["vaqt"], text: "Vaziyat og'irlashmoqda\nSoat yaqinlashmoqda\nO'yin-kulgu orqada\nQolib hayrlashmoqda.\n\nKunduz tugamay turib,\nTunni kutib olyabmiz.\nYoruq, nurli kunlarni\nBiz yo'qotib boryabmiz." },
  { d: "15.12.2023", th: ["iymon","sher"], text: "Ilhom keldi — so'zlarni yozdim,\nAyni shu dam aqldan ozdim.\n\nMen insonman, odam bolasi,\nNahotki men orqada qoldim?\n\nRasululloh ummati,\ndavom etay, Sunnati.\n\nRobbim, bizni kechirsin\nRohim ismi hurmati.\n\nRahmat, Robbim, Senga shukurlar,\nYodga solding O'zingni.\n\nErta kundan boshlayman —\nYodlayman har so'zingni." },
  { d: "19.12.2023", th: ["jamiyat"], text: "Odamlarni ko'rdim yoshlari katta,\nLekin ma'nosi yo'q, hayot g'aflatda.\nKuni tuni o'tar mehnat mashaqqatda,\nMantiqsiz hayot, nima maqsadda?" },
  { d: "10.03.2024", th: ["sevgi"], text: "Maftun ko'zlarga mahliyo bo'lib\nMahkum bo'ldim mudom termulib,\nOy kabi nurli bu yuzni ko'rib\nSevdimmi bilmadim, lek sevinib qo'ydim.\n\nSabab tosh oynada o'zimni ko'rdim)" },
  { d: "18.03.2024", th: ["inson"], text: "Qaddingni tik tut,\nO'zingni o'ngla,\n\nRuhingni tushurma,\nDoim rost so'zla.\n\nIbrohim hayosin,\nAllohdan so'ra,\n\nHar bir qilayotgan\nishingni o'yla." },
  { d: "11.04.2024", th: ["iymon"], text: "Hatm kuni yoshlandi ko'zim,\nRobbim uchun boshlandi tazim.\nToqatim yetgancha qildim toatim,\nTamoman Robbim tomon yuzlandim." },
  { d: "11.04.2024", th: ["sher"], text: "She'r yozay deyman,\nQo'lim yozmaydi,\nQalbimdagi so'zlar\nTilga bormaydi.\n\nHolatmi shu,\nEshit ey do'stim,\nMeni sendan boshqa\nHech kim ko'rmaydi." },
  { d: "03.09.2024", th: ["vaqt"], text: "Ishim ko'p deb boshim qotadi,\nKunlar sanab oylar o'tadi.\nHaq aytarkan yoshi kattalar —\nIsh tugamas, umr ketadi." },
  { d: "26.10.2024", th: ["inson"], text: "Kun-u tunlar doim bedorman.\nBilmam, balki xasta bemorman.\nHolim so'rab kelgan qavmimga\nSo'zlarim zo'r, yaxshi mezbonman.\nNe qilsam ham oddiy insonman.\n\nOilam uchun ishonchli posbon,\nMen ularga to'g'on, qalqonman.\nQuduqdan suv kerak bo'lsa,\nChelak uchun uzun arqonman.\nNe qilsam ham oddiy insonman.\n\nDo'stlarim bor, haqda sobit,\nTo'g'ri qo'ygan mezonlarini.\nGuvohman-ki, bari obid,\nMen ularga tirik isbotman.\nNe qilsam ham oddiy insonman.\n\nHayotimda uchragan yorim,\nNasib qilsa bo'lar ayolim,\nDoim mendan so'raydi holim,\nMen u uchun yagona inson,\nNe qilsam ham oddiy insonman.\n\nJamoat ichida bir sanoq son,\nOdam uchun nevara inson.\nVaqti kelganda beruvchiman jon,\nHamma uchun oddiy insonman." },
  { d: "16.11.2024", th: ["iymon"], text: "Bilib turib qilyabman gunoh,\nVijdon azob beryabdi, Alloh.\nSen dunyoda yagona podshoh,\nQuling uchun bergin bir panoh.\n\nBelgi berding, \"to'xtat so'zingni\",\nBoshqa bosma, yo'qot izingni.\nQilolmadim aytgan amringni —\nVijdon azob beryabdi, Alloh.\n\nYolg'on bo'lsa, uzgin arqonni,\nO'rtamizga qo'ygin qalqonni.\nTil ostiga to'ldir talqonni —\nNafsim zulm qilyabdi, Alloh.\n\nHolim harob bo'lyabdi, Alloh,\nNahot sarob ko'ryabman, Iloh.\nUmr ozdir, bildirding O'zing,\nQonun menga aytgan har so'zing" },
  { d: "05.07.2025", th: ["qadar"], text: "Qiyomat ko'zlarni ochgan lahzada\nMunofiq kofirlar qayg'uga botar\nDo'stim shu Kun seni topaman\nOz vaqt qoldi, qadar... bu qadar...\n\nAzroil rahimsiz muhlat bermaydi\nNavbat kelsa to'xtamas qaytmas\nBeruvchi Rabbim, jon omonati\nOlguvchi ham o'zi, qadar... bu qadar...\n\nShohmi u yo g'arib bari ketadi\nSo'ngi so'zin oxir aytadi\n\"Inson\" senga bersin Sabrun Jamil\nQabul qilgin qadar... bu qadar..." },
  { d: "03.09.2025", th: ["inson"], text: "Yo'lim olis, chuqurlar ko'p,\nQo'limdadir kichik bir sham.\n\nOlovining mitti nuri,\nYoritadi yo'lni har dam.\n\nO'zi nozik, so'nar zumda,\nAsrash kerak shabbodadan." },
  { d: "26.09.2025", th: ["qadar"], text: "So'zlay desak minglab so'zlar,\nLek bir jumla tuzolmadik\nDo'stim o'rning bilindi ko'p\nBiror malham topolmadik\n\nYodga keldi ajib damlar\nHar bir joyda xotiralar\nShunday ekan biz ojizmiz\nQadar deymiz xotir aylab\n\nXavotir yo'q xotirjammiz\nKo'ngil sezar biz bilamiz\nVaqt o'tadi muddat aniq\nOxir diydor ko'rishamiz" },
  { d: "27.09.2025", th: ["sher","qadar"], text: "She'r yozishda mohir emasman,\nQalamim yozar goho bir nelar.\nNe yozsam ham, o'qigan inson\nHikmat topsin, o'ylansin, deyman.\n\nShe'riy satrlar ajib chiroyli,\nBa'zan sirlar aytilar unda.\nShoshma, to'xta, chuqur nafas ol,\nQayta o'qi — toparsan shunda.\n\nShe'r ham balki qadar misoli,\nYozilgandir qalb kitobida.\nVaqti kelsa, siyohga sizib,\nSuriladi nomai a'moliga." },
  { d: "03.10.2025", th: ["qadar"], text: "Dunyo ko'rdi toshbaqa, maqsad sari talpinar,\nManzil aniq bo'lsa-da, taqdir uni hal qilar.\nChetdan ko'rsang, mushkulmas — daqiqalar kifoya,\nLekin toshbaqa ko'zida, butkul boshqa hikoya." },
  { d: "23.10.2025", th: ["vaqt","iymon"], text: "har bir kunning soni aniq\nhar bir kuning soni aniq\nhar bir kundan so'rar aniq\nhar bir kunga hokim Holiq" },
  { d: "23.10.2025", th: ["jamiyat","vaqt"], text: "Jamiyat johil — ko'plar g'avg'oda,\nG'arib qalblar, dardi dunyoda.\nDaromadi to'lsa karmonda,\nG'ofil dili — lek kuni savdoda.\n\nOqil inson, maqsadi sonmi?\nShu sonlari ko'paysa — hayot gulzormi?\nZohiran zo'r, botin marommi?\nMudom o'yla — maqsad matomi?\n\nDarhaqiqat, unutma haqni,\nAlmisog'da aytilgan ahdni.\nNasib o'ngdan olursan xatni,\nShunday ekan, qadrla vaqtni.\n\nKo'p odamzot sonlar quvladi,\nTunlar bedor, tongda mudradi.\nMudroq tutdi — haqni ko'rmadi,\nSon tugamas, umr tugadi.\n\nMahzun bo'lma, satrlar keskin,\nKeraksiz yuklaring ipini kesgin.\nShe'r ma'nosin qalb ila sezgin,\nJumla yakun — sakinat sezgin." },
  { d: "24.10.2025", th: ["sevgi","sher"], text: "Nechun yozmam sevgi haqida,\nBarcha shoir oshiq aslida.\nUl xushhidli gulning vaslida —\nSiyohdonning qalami namdir.\n\nHis qilishla totguvchisan ta'm,\nOz-oz misli asaldir malham.\nO'ng qo'ldagi yozuvchi qalam,\nYozar goho bu mavzuda ham." },
  { d: "27.10.2025", th: ["iymon"], text: "Dunyo bo'lsa dasturxon,\nXon kursidan kuzatar.\nNeni istasa inson,\nXon xohlasa uzatar.\n\nBa'zan inson o'ylanar —\nLoyiqmikan ushoqqa?\nXon aytadi: \"Qo'l uzat,\nGo'sht kesuvchi pichoqqa.\"\n\nDasturxon to'la ne'mat,\nBeruvchi — oliy himmat.\nOlursan, aytib: \"Rahmat\",\nBadal bo'lur itoat." },
  { d: "27.10.2025", th: ["jamiyat"], text: "Changalda cho'g' ushlash zamoni,\nHavotirlan — nuring omonmi?\nAjratolmay yaxshi-yomonni,\nKo'rayapsan foyda, ziyonni." }
];

const MONTHS = ["yanvar","fevral","mart","aprel","may","iyun","iyul","avgust","sentabr","oktabr","noyabr","dekabr"];

POEMS.forEach((p, i) => {
  p.no = i + 1;
  const [d, m, y] = p.d.split(".");
  p.day = +d; p.month = +m; p.year = y;
  p.first = p.text.trim().split("\n")[0].replace(/[,.;:!?)\s—-]+$/, "");
  p.longDate = `${+d}-${MONTHS[+m - 1]}, ${y}-yil`;
});

/* ── per-viewer storage (safe) ── */
function load(key) { try { return new Set(JSON.parse(localStorage.getItem(key) || "[]")); } catch (e) { return new Set(); } }
function store(key, set) { try { localStorage.setItem(key, JSON.stringify([...set])); } catch (e) {} }
const read = load("inson-read");
const saved = load("inson-saved");

let filter = "all";
const app = document.getElementById("app");

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  kids.flat().forEach(c => c != null && n.append(c));
  return n;
}

function starIcon() {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("class", "star"); s.setAttribute("aria-hidden", "true");
  const u = document.createElementNS("http://www.w3.org/2000/svg", "use");
  u.setAttribute("href", "#star"); s.append(u);
  return s;
}

/* ── CONTENTS VIEW ── */
function renderHome() {
  document.title = "Inson";
  const years = [...new Set(POEMS.map(p => p.year))];
  const fav = POEMS[14];
  const favLines = fav.text.split("\n").slice(2, 4);

  const cover = el("section", { class: "cover" },
    el("canvas", { class: "wind", "aria-hidden": "true" }),
    starIcon(),
    el("div", { class: "eyebrow", text: "She'rlar to'plami" }),
    el("h1", { text: BOOK.title }),
    el("p", { class: "author", text: BOOK.author }),
    el("div", { class: "meta" },
      el("span", { class: "eyebrow", text: `${POEMS.length} ta she'r` }),
      el("span", { class: "eyebrow", text: `${years[0]} — ${years[years.length - 1]}` }),
      el("span", { class: "eyebrow", text: `${read.size} / ${POEMS.length} o'qildi` })
    ),
    el("blockquote", { class: "epigraph" },
      ...favLines.map(l => el("span", { class: "line", text: l })),
      el("cite", { text: `${fav.no}-she'r · ${fav.longDate}` })
    ),
    el("div", { class: "cover-actions" },
      el("a", { class: "btn solid", href: "#sher-1", text: "O'qishni boshlash →" }),
      el("button", { class: "btn", type: "button", id: "random", text: "Tasodifiy she'r", onclick: () => {
        const r = 1 + Math.floor(Math.random() * POEMS.length);
        location.hash = "sher-" + r;
      }})
    )
  );

  const list = el("div", { id: "list" });
  const chips = el("div", { class: "chips", role: "group", "aria-label": "Mavzular" });
  const head = el("div", { class: "contents-head" },
    el("h2", { text: "Mundarija" }),
    el("span", { class: "eyebrow", id: "count" })
  );

  function chipList() {
    chips.innerHTML = "";
    const opts = [["all", "Barchasi", POEMS.length]];
    for (const [k, v] of Object.entries(THEMES)) opts.push([k, v, POEMS.filter(p => p.th.includes(k)).length]);
    if (saved.size) opts.push(["saved", "♥ Saqlangan", saved.size]);
    if (filter === "saved" && !saved.size) filter = "all";
    opts.forEach(([k, label, n]) => chips.append(
      el("button", { class: "chip", type: "button", "aria-pressed": String(filter === k), onclick: () => { filter = k; chipList(); fill(); } },
        label, el("span", { class: "n", text: n }))
    ));
  }

  function fill() {
    list.innerHTML = "";
    const shown = POEMS.filter(p =>
      filter === "all" ? true : filter === "saved" ? saved.has(p.no) : p.th.includes(filter));
    document.getElementById("count").textContent = `${shown.length} ta`;
    if (!shown.length) { list.append(el("p", { class: "empty", text: "Bu bo'limda hozircha she'r yo'q." })); return; }
    years.forEach(y => {
      const items = shown.filter(p => p.year === y);
      if (!items.length) return;
      list.append(el("section", { class: "year" },
        el("h3", {}, y, el("span", { text: `${items.length} ta she'r` })),
        el("ul", { class: "rows" }, items.map(p => el("li", {},
          el("a", { class: "row" + (read.has(p.no) ? " read" : ""), href: "#sher-" + p.no },
            el("span", { class: "no", text: String(p.no).padStart(2, "0") }),
            el("span", { class: "first", text: p.first }),
            saved.has(p.no) ? el("span", { class: "saved", "aria-label": "saqlangan", text: "♥" }) : null,
            el("span", { class: "lead", "aria-hidden": "true" }),
            el("span", { class: "date", text: `${String(p.day).padStart(2,"0")}.${String(p.month).padStart(2,"0")}` })
          )
        )))
      ));
    });
  }

  const contents = el("section", { class: "contents", id: "mundarija" }, head, chips, list);

  const about = el("section", { class: "about" },
    el("h2", { text: "To'plam haqida" }),
    el("p", { text: `“${BOOK.title}” to'plamiga ${BOOK.author}ning ${years[0]}–${years[years.length-1]}-yillarda yozgan ${POEMS.length} ta she'ri kirgan.` }),
    el("p", { text: "She'rlar yozilgan sanasi bo'yicha tartiblangan. Har birini alohida ochish, saqlash va havolasini do'stga yuborish mumkin." })
  );

  app.replaceChildren(el("div", { class: "wrap view" }, cover, contents, about));
  startWind(cover.querySelector(".wind"));
  chipList(); fill();
}

/* ── POEM VIEW ── */
function renderPoem(no) {
  const p = POEMS[no - 1];
  if (!p) { location.hash = ""; return; }
  read.add(no); store("inson-read", read);
  document.title = `${p.first} — Inson`;

  const prev = POEMS[no - 2], next = POEMS[no];
  const stanzas = p.text.split(/\n\s*\n/);
  const note = el("div", { class: "note", role: "status" });

  const saveBtn = el("button", { class: "btn", type: "button", "aria-pressed": String(saved.has(no)) });
  const setSave = () => { const on = saved.has(no); saveBtn.textContent = on ? "♥ Saqlangan" : "♡ Saqlash"; saveBtn.setAttribute("aria-pressed", String(on)); };
  setSave();
  saveBtn.addEventListener("click", () => {
    saved.has(no) ? saved.delete(no) : saved.add(no);
    store("inson-saved", saved); setSave();
  });

  function copy(text, done) {
    const fallback = () => { note.textContent = "Nusxalab bo'lmadi. Matnni belgilab, qo'lda nusxalang."; };
    try {
      navigator.clipboard.writeText(text).then(() => { note.textContent = done; }, fallback);
    } catch (e) { fallback(); }
  }

  const page = el("div", { class: "wrap view" },
    el("header", { class: "bar" },
      el("a", { href: "#mundarija", text: "← Mundarija" }),
      el("span", { class: "pos", text: `${String(no).padStart(2,"0")} / ${POEMS.length}` })
    ),
    el("article", { class: "poem" },
      el("div", { class: "poem-head" },
        el("div", { class: "big", text: String(no).padStart(2, "0") }),
        el("div", { class: "eyebrow", text: p.longDate }),
        el("div", { class: "tags" }, p.th.map(t =>
          el("button", { class: "tag", type: "button", text: THEMES[t], onclick: () => { filter = t; location.hash = "mundarija"; } })))
      ),
      el("h1", { class: "eyebrow", style: "position:absolute;left:-9999px", text: p.first }),
      el("div", { class: "text" }, stanzas.map(s =>
        el("p", { class: "stanza" }, s.split("\n").map(l => el("span", { class: "line", text: l })))
      )),
      el("div", { class: "actions" },
        saveBtn,
        el("button", { class: "btn", type: "button", text: "Matnni nusxalash", onclick: () =>
          copy(`${p.text}\n\n— ${BOOK.author}, ${p.longDate}`, "Matn nusxalandi.") }),
        el("button", { class: "btn", type: "button", text: "Havolani nusxalash", onclick: () =>
          copy(location.href, "Havola nusxalandi. Endi do'stingizga yuborishingiz mumkin.") })
      ),
      note
    ),
    el("nav", { class: "pager", "aria-label": "She'rlar" },
      prev ? el("a", { href: "#sher-" + prev.no },
        el("span", { class: "eyebrow", text: "← Oldingi" }), el("span", { class: "t", text: prev.first }))
        : el("span", { class: "ghost" }),
      next ? el("a", { class: "next", href: "#sher-" + next.no },
        el("span", { class: "eyebrow", text: "Keyingi →" }), el("span", { class: "t", text: next.first }))
        : el("a", { class: "next", href: "#mundarija" },
        el("span", { class: "eyebrow", text: "Oxiri" }), el("span", { class: "t", text: "Mundarijaga qaytish" }))
    ),
    el("p", { class: "hint", text: "Telefonda: chapga yoki o'ngga suring · Kompyuterda: ← → tugmalari" })
  );
  app.replaceChildren(page);
}

/* ── ROUTER ── */
function route() {
  const h = location.hash.replace("#", "");
  const m = h.match(/^sher-(\d+)$/);
  if (m) { renderPoem(+m[1]); window.scrollTo(0, 0); }
  else {
    renderHome();
    if (h === "mundarija") document.getElementById("mundarija").scrollIntoView();
    else window.scrollTo(0, 0);
  }
}
function current() { const m = location.hash.match(/^#sher-(\d+)$/); return m ? +m[1] : 0; }
function go(dir) {
  const n = current(); if (!n) return;
  const t = n + dir; if (t >= 1 && t <= POEMS.length) location.hash = "sher-" + t;
}

window.addEventListener("hashchange", route);
document.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea")) return;
  if (e.key === "ArrowLeft") go(-1);
  if (e.key === "ArrowRight") go(1);
  if (e.key === "Escape" && current()) location.hash = "mundarija";
});
let tx = 0, ty = 0;
document.addEventListener("touchstart", e => { tx = e.changedTouches[0].clientX; ty = e.changedTouches[0].clientY; }, { passive: true });
document.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
}, { passive: true });

/* ── WIND (shabboda) ── */
function startWind(cv) {
  const ctx = cv.getContext("2d");
  const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W = 0, H = 0, dpr = 1, streaks = [], motes = [], visible = true, t0 = performance.now();
  const rnd = (a, b) => a + Math.random() * (b - a);

  function colors() {
    const cs = getComputedStyle(document.documentElement);
    return { line: cs.getPropertyValue("--muted").trim() || "#7f8697", dot: cs.getPropertyValue("--lapis").trim() || "#1b6a78" };
  }
  let col = colors();

  function newStreak(anywhere) {
    const len = rnd(W * .18, W * .45);
    return { x: anywhere ? rnd(-len, W) : rnd(-len * 1.6, -len), y: rnd(H * .08, H * .92), len,
      speed: rnd(.35, 1.0), amp: rnd(4, 16), freq: rnd(.006, .014), ph: rnd(0, 6.28), w: rnd(.6, 1.3), a: rnd(.18, .45) };
  }
  function newMote(anywhere) {
    return { x: anywhere ? rnd(0, W) : rnd(-40, -5), y: rnd(0, H), r: rnd(.8, 2), sp: rnd(.6, 1.6), ph: rnd(0, 6.28), a: rnd(.25, .6) };
  }
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(Math.max(7, Math.min(16, W / 60)));
    streaks = Array.from({ length: n }, () => newStreak(true));
    motes = Array.from({ length: Math.round(n * 1.4) }, () => newMote(true));
  }

  function frame(now) {
    if (!cv.isConnected) return;
    const time = (now - t0) / 1000;
    // gusts: slow swell plus an occasional stronger breath
    const gust = .55 + .3 * Math.sin(time * .35) + .35 * Math.max(0, Math.sin(time * .9 + 1.3)) ** 6;
    ctx.clearRect(0, 0, W, H);
    ctx.lineCap = "round";
    ctx.strokeStyle = col.line;
    for (const s of streaks) {
      if (!still) s.x += s.speed * gust * 2.2;
      const steps = 28;
      for (let i = 0; i < steps; i++) {
        const t1 = i / steps, t2 = (i + 1) / steps;
        const x1 = s.x + t1 * s.len, x2 = s.x + t2 * s.len;
        const y1 = s.y + Math.sin(x1 * s.freq + s.ph + time * .8) * s.amp * gust;
        const y2 = s.y + Math.sin(x2 * s.freq + s.ph + time * .8) * s.amp * gust;
        ctx.globalAlpha = s.a * Math.sin(Math.PI * t1) * Math.min(1, gust);
        ctx.lineWidth = s.w;
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      }
      if (s.x > W + 20) Object.assign(s, newStreak(false));
    }
    ctx.fillStyle = col.dot;
    for (const m of motes) {
      if (!still) { m.x += m.sp * gust * 2.6; m.y += Math.sin(time * 1.4 + m.ph) * .35; }
      ctx.globalAlpha = m.a;
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 6.283); ctx.fill();
      if (m.x > W + 10) Object.assign(m, newMote(false));
    }
    ctx.globalAlpha = 1;
    if (!still && visible) requestAnimationFrame(frame);
  }

  resize();
  frame(performance.now());
  const ro = new ResizeObserver(() => { if (cv.isConnected) { resize(); if (still) frame(performance.now()); } });
  ro.observe(cv);
  const io = new IntersectionObserver(([e]) => {
    const was = visible; visible = e.isIntersecting && !document.hidden;
    if (visible && !was && !still) requestAnimationFrame(frame);
  });
  io.observe(cv);
  document.addEventListener("visibilitychange", () => {
    const was = visible; visible = !document.hidden;
    if (visible && !was && !still && cv.isConnected) requestAnimationFrame(frame);
  });
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  mq.addEventListener && mq.addEventListener("change", () => { col = colors(); });
}

route();
</script>
