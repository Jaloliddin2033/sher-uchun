<style>
  /* Layout: a book. Cover + ilhom xaritasi + mundarija on one page, each poem on its own page (#sher-N). Single narrow reading column. */
  :root {
    --paper: #eceee8;
    --paper-2: #e2e5de;
    --ink: #1d2740;
    --ink-soft: #4d5670;
    --muted: #7f8697;
    --rule: #c9cdc4;
    --lapis: #1b6a78;
    --lapis-wash: rgba(27,106,120,.10);
    --glow: rgba(255,176,92,0);
    --danger: #b2452f;
    --lamp-ink: #2e2617;
    --f-display: "Marcellus", "Times New Roman", serif;
    --f-body: "Spectral", Georgia, "Times New Roman", serif;
    --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #121620; --paper-2: #1a1f2b; --ink: #dfe4ea; --ink-soft: #aab2c0;
      --muted: #737c8d; --rule: #2b3241; --lapis: #62b8c4; --lapis-wash: rgba(98,184,196,.12);
      --glow: rgba(255,176,92,.11);
      --danger: #e58a75;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #121620; --paper-2: #1a1f2b; --ink: #dfe4ea; --ink-soft: #aab2c0;
    --muted: #737c8d; --rule: #2b3241; --lapis: #62b8c4; --lapis-wash: rgba(98,184,196,.12);
    --glow: rgba(255,176,92,.11);
    --danger: #e58a75;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; overflow-x: clip; }
  body { overflow-x: clip; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: var(--f-body); font-size: 18px; line-height: 1.6;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
    z-index: 10; background: var(--paper);
  }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--lapis); outline-offset: 3px; border-radius: 2px; }

  .wrap { max-width: 38rem; margin: 0 auto; }
  .view { animation: in .45s ease both; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .eyebrow {
    font-family: var(--f-mono); font-size: .72rem; letter-spacing: .14em;
    text-transform: uppercase; color: var(--muted);
  }
  .section-title { font-family: var(--f-display); font-weight: 400; font-size: 1.7rem; margin: 0; }

  /* ── SCRIPT SWITCH (Lotin / Кирилл) ── */
  .script { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; padding: 2px; background: var(--paper); }
  .script button {
    font-family: var(--f-mono); font-size: .68rem; letter-spacing: .04em;
    border: 0; background: transparent; padding: .3rem .65rem; border-radius: 999px; cursor: pointer; color: var(--ink-soft);
  }
  .script button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

  /* ── COVER ── */
  .cover { padding-block: 4.5rem 3rem; display: grid; gap: 1.4rem; justify-items: start; position: relative; isolation: isolate; }
  .cover > :not(.wind) { position: relative; z-index: 1; }
  .wind {
    position: absolute; top: 0; bottom: 0; left: 50%; width: 100vw; margin-left: -50vw;
    z-index: 0; pointer-events: none; display: block;
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 12%, #000 80%, transparent);
    mask-image: linear-gradient(to bottom, transparent, #000 12%, #000 80%, transparent);
  }
  .title-wrap { position: relative; }
  .title-wrap .bl { display: inline-block; width: 0; height: 0; vertical-align: baseline; }
  .scene { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .sc-ink { fill: var(--ink); }
  .sc-paper { fill: var(--paper); }
  .sc-lapis { fill: var(--lapis); }
  .sc-lampink { fill: var(--lamp-ink); }
  .sc-sheet { fill: #fbf3dc; }
  .sc-flame { fill: #fff3b8; }
  .sc-halo { flood-color: var(--paper); }
  .win-hit { fill: transparent; pointer-events: all; cursor: pointer; }
  .win-hit:focus { outline: none; }
  .win-hit:focus-visible { stroke: var(--lapis); stroke-width: 2; }
  .cover-top { display: flex; justify-content: space-between; align-items: center; gap: 1rem; justify-self: stretch; }
  .star { width: 44px; height: 44px; color: var(--lapis); }
  .cover h1 {
    font-family: var(--f-display); font-weight: 400;
    font-size: clamp(4.2rem, 19vw, 7.5rem); line-height: .9; letter-spacing: .02em;
    margin: 0; text-wrap: balance;
  }
  .cover .author { font-family: var(--f-display); font-size: 1.25rem; letter-spacing: .12em; text-transform: uppercase; margin: 0; }
  .cover .meta { display: flex; flex-wrap: wrap; gap: .4rem 1.4rem; }
  .daily { margin: .8rem 0 0; padding-left: 1rem; border-left: 2px solid var(--lapis); display: grid; gap: .35rem; }
  .daily .eyebrow { color: var(--lapis); }
  .daily blockquote { margin: 0; font-style: italic; font-weight: 300; color: var(--ink-soft); line-height: 1.7; font-size: 1.08rem; }
  .daily a { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .08em; color: var(--muted); text-decoration: none; }
  .daily a:hover { color: var(--lapis); }
  .cover-actions { display: flex; flex-wrap: wrap; gap: .7rem; margin-top: .6rem; }
  .btn {
    display: inline-flex; align-items: center; gap: .5rem;
    font-family: var(--f-mono); font-size: .78rem; letter-spacing: .06em;
    padding: .7rem 1.1rem; border: 1px solid var(--ink); background: transparent;
    text-decoration: none; cursor: pointer; border-radius: 2px;
    transition: background .2s, color .2s, border-color .2s;
  }
  .btn.solid { background: var(--ink); color: var(--paper); }
  .btn:hover { background: var(--ink); color: var(--paper); }
  .btn.solid:hover { background: var(--lapis); border-color: var(--lapis); }
  .btn.quiet { border-color: var(--rule); color: var(--ink-soft); }
  .btn.quiet:hover { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .btn[aria-pressed="true"] { background: var(--lapis); border-color: var(--lapis); color: var(--paper); }

  /* ── ILHOM XARITASI ── */
  .ilhom { border-top: 1px solid var(--rule); padding-block: 2rem 2.4rem; }
  .ilhom p.sub { margin: .4rem 0 1.3rem; color: var(--ink-soft); font-size: .98rem; }
  .map { display: grid; grid-template-columns: 2.4rem repeat(12, minmax(0, 1fr)); gap: 4px; }
  .map .mh { font-family: var(--f-mono); font-size: .62rem; color: var(--muted); text-align: center; padding-bottom: 2px; }
  .map .yl { font-family: var(--f-mono); font-size: .66rem; color: var(--muted); align-self: center; }
  .cell {
    min-height: 2.3rem; border-radius: 3px; background: var(--paper-2);
    display: flex; flex-wrap: wrap; align-content: flex-end; justify-content: center; gap: 2px; padding: 4px 2px;
  }
  .cell.out { background: transparent; border: 1px dashed var(--rule); }
  .dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--lapis); display: block;
    transition: transform .15s;
  }
  .dot:hover, .dot:focus-visible { transform: scale(1.6); }
  .dot.read { background: transparent; box-shadow: inset 0 0 0 1.5px var(--lapis); }
  .map-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: .4rem 1rem; margin-top: .9rem; }
  .legend { display: inline-flex; align-items: center; gap: .9rem; }
  .legend span { display: inline-flex; align-items: center; gap: .35rem; }

  /* ── CONTENTS ── */
  .contents { padding-block: 1rem 3rem; border-top: 1px solid var(--rule); }
  .contents-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; padding-top: 2rem; }
  .chips { display: flex; flex-wrap: wrap; gap: .45rem; margin: 1.2rem 0 .6rem; }
  .chip {
    font-family: var(--f-mono); font-size: .72rem; letter-spacing: .04em;
    padding: .38rem .75rem; border: 1px solid var(--rule); background: transparent;
    border-radius: 999px; cursor: pointer; color: var(--ink-soft);
    transition: border-color .2s, background .2s, color .2s;
  }
  .chip:hover { border-color: var(--ink-soft); color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .chip .n { opacity: .6; margin-left: .25rem; }

  .year { margin-top: 2rem; }
  .year h3 {
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: var(--f-display); font-weight: 400; font-size: 1.15rem; margin: 0 0 .4rem;
    padding-bottom: .4rem; border-bottom: 1px solid var(--rule);
  }
  .year h3 span { font-family: var(--f-mono); font-size: .7rem; color: var(--muted); letter-spacing: .08em; }
  .rows { list-style: none; margin: 0; padding: 0; }
  .row { display: flex; align-items: baseline; gap: .7rem; padding: .62rem 0; text-decoration: none; position: relative; }
  .row .no { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); min-width: 1.6rem; font-variant-numeric: tabular-nums; position: relative; }
  .row.read .no::after { content: ""; position: absolute; left: -.75rem; top: .45em; width: 5px; height: 5px; border-radius: 50%; background: var(--lapis); }
  .row .first { min-width: 0; font-size: 1.05rem; transition: color .2s; }
  .row .lead { flex: 1 1 1.5rem; min-width: 1rem; border-bottom: 1px dotted var(--rule); transform: translateY(-.3em); }
  .row .date { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row .saved { color: var(--lapis); font-size: .8rem; }
  .row:hover .first { color: var(--lapis); }
  .empty { color: var(--muted); font-style: italic; padding: 2rem 0; }

  .about { border-top: 1px solid var(--rule); padding-block: 2rem 4rem; color: var(--ink-soft); font-size: 1rem; }
  .about h2 { font-family: var(--f-display); font-weight: 400; font-size: 1.2rem; color: var(--ink); margin: 0 0 .6rem; }
  .about p { margin: 0 0 .7rem; max-width: 34rem; }

  /* ── POEM PAGE ── */
  .bar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: var(--paper);
    display: flex; justify-content: space-between; align-items: center; gap: .8rem;
    padding-block: .8rem; border-bottom: 1px solid var(--rule);
  }
  .bar a { font-family: var(--f-mono); font-size: .78rem; letter-spacing: .06em; text-decoration: none; color: var(--ink-soft); white-space: nowrap; }
  .bar a:hover { color: var(--lapis); }
  .bar .right { display: flex; align-items: center; gap: .8rem; }
  .bar .pos { font-family: var(--f-mono); font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }

  .poem { padding-block: 3rem 2rem; position: relative; isolation: isolate; }
  .glow {
    position: absolute; z-index: -1; pointer-events: none;
    left: 50%; width: 140vw; margin-left: -70vw; top: 4rem; height: 80vh;
    background: radial-gradient(ellipse 38% 42% at 50% 40%, var(--glow), transparent 72%);
    animation: flicker 6s ease-in-out infinite;
  }
  @keyframes flicker {
    0%, 100% { opacity: .85; transform: scale(1); }
    18% { opacity: 1; transform: scale(1.03); }
    31% { opacity: .72; transform: scale(.99); }
    47% { opacity: .95; transform: scale(1.01); }
    63% { opacity: .78; transform: scale(.98); }
    82% { opacity: 1; transform: scale(1.02); }
  }
  .poem-head { display: grid; gap: .5rem; margin-bottom: 1.8rem; }
  .poem-head .big { font-family: var(--f-display); font-size: clamp(3.4rem, 14vw, 5rem); line-height: 1; color: var(--lapis); font-variant-numeric: tabular-nums; }
  .tags { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .3rem; }
  .tag {
    font-family: var(--f-mono); font-size: .68rem; letter-spacing: .04em;
    padding: .25rem .6rem; border-radius: 999px; background: var(--lapis-wash); color: var(--lapis);
    border: none; cursor: pointer;
  }
  .tag:hover { text-decoration: underline; }
  .tools { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 2rem; }

  .text { font-size: clamp(1.12rem, 3.6vw, 1.32rem); line-height: 1.85; font-weight: 400; }
  .text.slow { cursor: pointer; }
  .stanza { margin: 0 0 1.6em; }
  .line { display: block; padding-left: 1.4em; text-indent: -1.4em; }
  .text.ink .line { animation: ink 1s cubic-bezier(.3,.6,.25,1) both; animation-delay: calc(var(--i) * 110ms + 150ms); }
  @keyframes ink {
    from { clip-path: inset(0 100% 0 0); opacity: .25; }
    to { clip-path: inset(0 -2% 0 0); opacity: 1; }
  }
  .line.wait { display: none; }
  .stanza:not(:has(.line:not(.wait))) { display: none; }
  .line.appear { animation: appear .7s ease both; }
  @keyframes appear { from { opacity: 0; transform: translateY(4px); filter: blur(2px); } to { opacity: 1; transform: none; filter: none; } }
  .more { margin-top: .4rem; }
  .slow-hint { font-family: var(--f-mono); font-size: .7rem; color: var(--muted); margin: 0 0 1.4rem; }

  .actions { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 2.4rem; padding-top: 1.6rem; border-top: 1px solid var(--rule); }
  .note { font-family: var(--f-mono); font-size: .72rem; color: var(--lapis); min-height: 1.2em; margin-top: .6rem; }

  /* ── AUDIO PLAYER ── */
  .player { display: flex; align-items: center; gap: .9rem; padding: .8rem .9rem; border: 1px solid var(--rule); border-radius: 4px; margin: -.6rem 0 2rem; background: var(--paper-2); }
  .play { width: 2.75rem; height: 2.75rem; flex: none; border-radius: 50%; border: 0; background: var(--lapis); color: var(--paper); cursor: pointer; display: grid; place-items: center; transition: transform .15s; }
  .play:hover { transform: scale(1.06); }
  .play svg { width: 16px; height: 16px; fill: currentColor; }
  .player-mid { flex: 1; min-width: 0; display: grid; gap: .25rem; }
  .player-label { display: flex; gap: .6rem; align-items: baseline; justify-content: space-between; }
  .player .by { font-family: var(--f-mono); font-size: .64rem; color: var(--muted); }
  .seek { width: 100%; accent-color: var(--lapis); margin: 0; height: 1.2rem; cursor: pointer; }
  .time { font-family: var(--f-mono); font-size: .7rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ── IMAGE MAKER ── */
  .maker { margin-top: 1.4rem; padding: 1.2rem; border: 1px solid var(--rule); border-radius: 4px; background: var(--paper-2); display: grid; gap: 1rem; }
  .maker h2 { font-family: var(--f-display); font-weight: 400; font-size: 1.25rem; margin: 0; }
  .maker .group { display: grid; gap: .45rem; }
  .maker .opts { display: flex; flex-wrap: wrap; gap: .4rem; }
  .maker .opt-stanza { text-align: left; font-family: var(--f-body); font-style: italic; font-size: .95rem; letter-spacing: 0; max-width: 100%; }
  .preview-box { display: flex; justify-content: center; background: var(--paper); border-radius: 3px; padding: .8rem; }
  .preview-box img { max-height: 70vh; max-width: 100%; width: auto; border-radius: 2px; box-shadow: 0 6px 24px rgba(0,0,0,.18); display: block; }
  .maker .row-btns { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  .maker small { font-family: var(--f-mono); font-size: .68rem; color: var(--muted); }

  /* ── MUALLIFGA YOZISH (Telegram) ── */
  .letter { border-top: 1px solid var(--rule); padding-block: 2rem 2.4rem; display: grid; gap: .4rem; }
  .letter .sub { margin: 0 0 .8rem; color: var(--ink-soft); font-size: .98rem; }
  .letter .demo { margin: 0 0 .6rem; justify-self: start; font-family: var(--f-mono); font-size: .68rem; letter-spacing: .06em; padding: .3rem .6rem; border: 1px dashed var(--muted); border-radius: 2px; color: var(--muted); }
  .letter-form { display: grid; gap: 1.1rem; position: relative; }
  .field { display: grid; gap: .4rem; min-width: 0; }
  .field .lab { display: flex; justify-content: space-between; gap: .6rem; }
  .letter-form input, .letter-form textarea, .letter-form select {
    width: 100%; min-width: 0; font: inherit; font-size: 1rem; color: var(--ink); background: var(--paper);
    border: 1px solid var(--rule); border-radius: 3px; padding: .65rem .75rem;
  }
  .letter-form textarea { resize: vertical; min-height: 6.5rem; line-height: 1.6; }
  .letter-form input:focus, .letter-form textarea:focus, .letter-form select:focus { outline: none; border-color: var(--lapis); box-shadow: 0 0 0 3px var(--lapis-wash); }
  .letter-form ::placeholder { color: var(--muted); opacity: 1; }
  .letter .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: 1rem; }
  .letter .opts { display: flex; flex-wrap: wrap; gap: .4rem; }
  .trap { position: absolute !important; left: -9999px; width: 1px; height: 1px; opacity: 0; }
  .field-err { margin: 0; font-family: var(--f-mono); font-size: .72rem; color: var(--danger); }
  .field-err:empty { display: none; }
  .preview { display: grid; gap: .45rem; }
  .bubble { margin: 0; justify-self: start; max-width: 100%; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--f-body); font-size: .92rem; line-height: 1.5; color: var(--ink); background: var(--lapis-wash); border-radius: 14px 14px 14px 4px; padding: .8rem 1rem; }
  .letter .row-btns { display: flex; flex-wrap: wrap; gap: .6rem; }
  .btn:disabled { opacity: .6; cursor: wait; }

  .pager { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; padding-block: 2rem 4rem; }
  .pager a { display: grid; gap: .3rem; text-decoration: none; padding: 1rem; border: 1px solid var(--rule); border-radius: 2px; min-width: 0; transition: border-color .2s, background .2s; }
  .pager a:hover { border-color: var(--lapis); background: var(--lapis-wash); }
  .pager a.next { text-align: right; }
  .pager .t { font-style: italic; font-size: .98rem; overflow-wrap: anywhere; }
  .pager .ghost { visibility: hidden; }
  .hint { text-align: center; font-family: var(--f-mono); font-size: .68rem; color: var(--muted); padding-bottom: 2rem; }

  @media (prefers-reduced-motion: reduce) {
    .view, .glow, .text.ink .line, .line.appear { animation: none; }
  }
  @media (max-width: 480px) {
    body { font-size: 17px; }
    .cover { padding-block: 3rem 2rem; }
    .pager { grid-template-columns: 1fr; }
    .pager a.next { text-align: left; }
    .row .first { font-size: 1rem; }
    .map { grid-template-columns: 2rem repeat(12, minmax(0, 1fr)); gap: 3px; }
    .dot { width: 6px; height: 6px; }
    .bar .pos { display: none; }
  }
</style>
</head>

<main id="app"></main>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="star" viewBox="0 0 48 48">
    <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 3 L36 26 L31 37 L17 37 L12 26 Z"/>
      <line x1="24" y1="3" x2="24" y2="23"/>
      <circle cx="24" cy="26.5" r="2.6"/>
      <rect x="17" y="37" width="14" height="8" rx="1"/>
    </g>
  </symbol>
</svg>

/* ── per-viewer storage (safe) ── */
function loadSet(key) { try { return new Set(JSON.parse(localStorage.getItem(key) || "[]")); } catch (e) { return new Set(); } }
function storeSet(key, set) { try { localStorage.setItem(key, JSON.stringify([...set])); } catch (e) {} }
function loadVal(key, def) { try { return localStorage.getItem(key) ?? def; } catch (e) { return def; } }
function storeVal(key, v) { try { localStorage.setItem(key, v); } catch (e) {} }
const read = loadSet("inson-read");

/* ── LOTIN → КИРИЛЛ ── */
const SINGLE = { a:"а", b:"б", c:"ц", d:"д", e:"е", f:"ф", g:"г", h:"ҳ", i:"и", j:"ж", k:"к", l:"л", m:"м", n:"н", o:"о", p:"п", q:"қ", r:"р", s:"с", t:"т", u:"у", v:"в", w:"в", x:"х", y:"й", z:"з" };
const isLat = ch => /[A-Za-z]/.test(ch || "");
const isApos = ch => ch === "'" || ch === "’" || ch === "ʼ" || ch === "‘";
function toCyr(s) {
  let out = "", i = 0;
  while (i < s.length) {
    const c = s[i];
    if (!isLat(c)) {
      if (isApos(c) && isLat(s[i - 1]) && isLat(s[i + 1])) { out += "ъ"; i++; continue; }
      out += c; i++; continue;
    }
    const n1 = s[i + 1] || "", n2 = s[i + 2] || "";
    const lc = c.toLowerCase(), l1 = n1.toLowerCase();
    const prevLetter = isLat(s[i - 1]) || (isApos(s[i - 1]) && isLat(s[i - 2]));
    let rep, len;
    if (lc === "y" && l1 === "o" && isApos(n2)) { rep = "йў"; len = 3; }
    else if (lc === "o" && isApos(n1)) { rep = "ў"; len = 2; }
    else if (lc === "g" && isApos(n1)) { rep = "ғ"; len = 2; }
    else if (lc === "s" && l1 === "h") { rep = "ш"; len = 2; }
    else if (lc === "c" && l1 === "h") { rep = "ч"; len = 2; }
    else if (lc === "y" && l1 === "o") { rep = "ё"; len = 2; }
    else if (lc === "y" && l1 === "u") { rep = "ю"; len = 2; }
    else if (lc === "y" && l1 === "a") { rep = "я"; len = 2; }
    else if (lc === "y" && l1 === "e" && !prevLetter) { rep = "е"; len = 2; }
    else if (lc === "e" && !prevLetter) { rep = "э"; len = 1; }
    else { rep = SINGLE[lc] || c; len = 1; }
    const src = s.substr(i, len).replace(/[^A-Za-z]/g, "");
    const upper = c === c.toUpperCase();
    const allUpper = src.length > 1 && src === src.toUpperCase();
    if (allUpper) rep = rep.toUpperCase();
    else if (upper) rep = rep[0].toUpperCase() + rep.slice(1);
    out += rep; i += len;
  }
  return out;
}
const T = s => script === "cyr" ? toCyr(s) : s;

function applyScript(root) {
  if (script !== "cyr") return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: n => n.parentElement && n.parentElement.closest("[data-keep]") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT
  });
  const nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n => { n.nodeValue = toCyr(n.nodeValue); });
  root.querySelectorAll("[aria-label], [title], [alt]").forEach(e => {
    if (e.closest("[data-keep]")) return;
    ["aria-label", "title", "alt"].forEach(a => { if (e.hasAttribute(a)) e.setAttribute(a, toCyr(e.getAttribute(a))); });
  });
}

/* ── helpers ── */
function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k === "hidden") n.hidden = true;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  kids.flat().forEach(c => c != null && n.append(c));
  return n;
}
function svgUse(id, cls) {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("class", cls); s.setAttribute("aria-hidden", "true");
  const u = document.createElementNS("http://www.w3.org/2000/svg", "use");
  u.setAttribute("href", "#" + id); s.append(u);
  return s;
}
const pad2 = n => String(n).padStart(2, "0");

function scriptSwitch() {
  const set = v => { if (script === v) return; script = v; storeVal("inson-script", v); route({ keepScroll: true, noInk: true }); };
  return el("div", { class: "script", role: "group", "aria-label": "Yozuv", "data-keep": "" },
    el("button", { type: "button", "aria-pressed": String(script === "lat"), onclick: () => set("lat"), text: "Lotin" }),
    el("button", { type: "button", "aria-pressed": String(script === "cyr"), onclick: () => set("cyr"), text: "Кирилл" })
  );
}

/* ── KUN SATRI ── */
function dailyLine() {
  const now = new Date();
  const dayIndex = Math.floor((now.getTime() - now.getTimezoneOffset() * 60000) / 86400000);
  const p = POEMS[dayIndex % POEMS.length];
  const st = p.stanzas[(dayIndex * 7) % p.stanzas.length];
  const lines = st.length > 4 ? st.slice(0, 2) : st.length === 4 ? st.slice(0, 2) : st;
  return { p, lines, label: `${now.getDate()}-${MONTHS[now.getMonth()]}` };
}

      el("span", { class: "legend eyebrow" },
        el("span", {}, el("i", { class: "dot", "aria-hidden": "true" }), "o'qilmagan"),

  /* contents */
  const list = el("div", { id: "list" });

  const count = el("span", { class: "eyebrow" });
  function chipList() {

/* Harfning ichki bo'shlig'ini (counter) piksel bo'yicha aniq kesib oladi: n — ark, o — oval.
   3 barobar kattalikda chizib, ichidan "suv quyib" (flood fill) shaklini topadi. */
function glyphCounter(ch, fontAt, size) {
  const S = 3, fz = size * S;
  const pad = Math.ceil(fz * .25), base = Math.ceil(fz * 1.25);
  const cw = Math.ceil(fz * 1.5), chh = Math.ceil(fz * 1.6);
  const c = document.createElement("canvas"); c.width = cw; c.height = chh;
  const x = c.getContext("2d", { willReadFrequently: true });
  x.font = fontAt(fz); x.textBaseline = "alphabetic"; x.fillStyle = "#000";
  x.fillText(ch, pad, base);
  const d = x.getImageData(0, 0, cw, chh).data;
  const N = cw * chh, A = new Uint8Array(N);
  for (let i = 0; i < N; i++) A[i] = d[i * 4 + 3] >= 128 ? 1 : 0;
  let top = -1;
  for (let py = 0; py < base && top < 0; py++) for (let px = 0; px < cw; px++) if (A[py * cw + px]) { top = py; break; }
  if (top < 0) return null;
  const xh = base - top;
  const sy = base - Math.round(xh * (ch === "n" ? .3 : .5));
  const runs = []; let st = -1;
  for (let px = 0; px <= cw; px++) {
    const on = px < cw && A[sy * cw + px];
    if (on && st < 0) st = px;
    if (!on && st >= 0) { runs.push([st, px - 1]); st = -1; }
  }
  if (runs.length < 2) return null;
  const sx = Math.round((runs[0][1] + (ch === "n" ? runs[1][0] : runs[runs.length - 1][0])) / 2);
  const maxY = ch === "n" ? base - 1 : chh - 2;
  const rowMin = new Int32Array(chh).fill(cw), rowMax = new Int32Array(chh).fill(-1);
  const seen = new Uint8Array(N), stack = [sy * cw + sx];
  while (stack.length) {
    const i = stack.pop();
    if (seen[i] || A[i]) continue;
    seen[i] = 1;
    const py = (i / cw) | 0, px = i - py * cw;
    if (px <= 0 || px >= cw - 1 || py <= 0) return null;
    if (px < rowMin[py]) rowMin[py] = px;
    if (px > rowMax[py]) rowMax[py] = px;
    stack.push(i - 1, i + 1, i - cw);
    if (py < maxY) stack.push(i + cw);
  }
  let y0 = -1, y1 = -1;
  for (let py = 0; py < chh; py++) if (rowMax[py] >= 0) { if (y0 < 0) y0 = py; y1 = py; }
  if (y0 < 0) return null;
  const ov = .7 * S;
  const X = v => (v - pad) / S, Y = v => (v - base) / S;
  const rows = [];
  for (let py = y0; py <= y1; py += S) rows.push(py);
  if (rows[rows.length - 1] !== y1) rows.push(y1);
  const left = [], right = [];
  rows.forEach(py => {
    const yy = py === y0 ? py - ov : py === y1 ? (ch === "n" ? base : py + 1 + ov) : py + .5;
    left.push([X(rowMin[py] - ov), Y(yy)]);
    right.push([X(rowMax[py] + 1 + ov), Y(yy)]);
  });
  const poly = left.concat(right.reverse());
  const xs = poly.map(p => p[0]);
  return { xh: xh / S, poly, l: Math.min(...xs), r: Math.max(...xs), top: Y(y0 - ov), bot: ch === "n" ? 0 : Y(y1 + 1 + ov) };
}

    if (tEl) { const tr = tEl.getBoundingClientRect(), cr = cv.getBoundingClientRect(); band = [tr.top - cr.top - 4, tr.bottom - cr.top + fs + 4]; }
    for (let k = 0; k < 14; k++) {
      y = rnd(H * .12 + fs, H * .9);
      if ((!band || y < band[0] || y > band[1]) && words.every(o => Math.abs(o.y - y) > fs * 2.2)) break;
    }
    words.push({ src, no, text, w, x: rnd(W * .04, Math.max(W * .05, W * .7 - w)), y, by: y,
      born: now, life: rnd(7000, 10000), sp: rnd(.12, .3), ph: rnd(0, 6.28) });
  }
  function wordAlpha(o, now) {
    if (still) return .7;
    const t = (now - o.born) / o.life;
    return Math.max(0, Math.min(1, t < .2 ? t / .2 : t > .7 ? (1 - t) / .3 : 1));
  }
  function hitWord(e) {
    const r = cv.getBoundingClientRect();
    const px = e.clientX - r.left, py = e.clientY - r.top;
    const now = performance.now();
    for (const o of words) {
      if (wordAlpha(o, now) < .15) continue;
      if (px >= o.x - 10 && px <= o.x + o.w + 10 && py >= o.y - fs - 6 && py <= o.y + fs * .4 + 6) return o;
    }
    return null;
  }
  function frame(now) {
    if (!cv.isConnected) return;
    const time = (now - t0) / 1000;
    const gust = .55 + .3 * Math.sin(time * .35) + .35 * Math.max(0, Math.sin(time * .9 + 1.3)) ** 6;
    ctx.clearRect(0, 0, W, H); ctx.lineCap = "round"; ctx.strokeStyle = col.line;
    for (const s of streaks) {
      if (!still) s.x += s.speed * gust * 2.2;
      for (let i = 0; i < 28; i++) {
        const t1 = i / 28, t2 = (i + 1) / 28, x1 = s.x + t1 * s.len, x2 = s.x + t2 * s.len;
        ctx.globalAlpha = s.a * Math.sin(Math.PI * t1) * Math.min(1, gust); ctx.lineWidth = s.w;
        ctx.beginPath();
        ctx.moveTo(x1, s.y + Math.sin(x1 * s.freq + s.ph + time * .8) * s.amp * gust);
        ctx.lineTo(x2, s.y + Math.sin(x2 * s.freq + s.ph + time * .8) * s.amp * gust);
        ctx.stroke();
      }
      if (s.x > W + 20) Object.assign(s, newStreak(false));
    }
    const dt = Math.min(100, lastNow ? now - lastNow : 16); lastNow = now;
    if (!still) {
      if (words.length < maxWords && now > nextSpawn) { spawnWord(now); nextSpawn = now + rnd(1400, 2800); }
      words = words.filter(o => (now - o.born) < o.life && o.x < W + 10 && o.y > -30);
    }
    ctx.font = wordFont(); ctx.textBaseline = "alphabetic";
    for (const o of words) {
      const isHover = o === hover;
      if (!still) {
        if (isHover) o.born += dt;
        else { if (o.rise) o.by -= o.rise; o.x += o.sp * gust * 1.4; o.y = o.by + Math.sin(time * .9 + o.ph) * 3; }
      }
      const a = wordAlpha(o, now);
      ctx.fillStyle = isHover ? col.dot : col.word;
      ctx.globalAlpha = isHover ? Math.max(a, .5) * .95 : a * .42;
      ctx.fillText(o.text, o.x, o.y);
    }
    ctx.fillStyle = col.dot;
    for (const m of motes) {
      if (!still) { m.x += m.sp * gust * 2.6; m.y += Math.sin(time * 1.4 + m.ph) * .35; }
      ctx.globalAlpha = m.a; ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 6.283); ctx.fill();
      if (m.x > W + 10) Object.assign(m, newMote(false));
    }
    ctx.globalAlpha = 1;
    if (!still && visible) requestAnimationFrame(frame);
  }
  resize(); frame(performance.now());
  const ro = new ResizeObserver(() => { if (cv.isConnected) { resize(); if (still) frame(performance.now()); } });
  ro.observe(cv);
  const io = new IntersectionObserver(([e]) => {
    const was = visible; visible = e.isIntersecting && !document.hidden;
    if (visible && !was && !still) requestAnimationFrame(frame);
  });
  io.observe(cv);
  const onVis = () => {
    const was = visible; visible = !document.hidden;
    if (visible && !was && !still && cv.isConnected) requestAnimationFrame(frame);
  };
  document.addEventListener("visibilitychange", onVis);
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  const onMq = () => { col = colors(); };
  mq.addEventListener && mq.addEventListener("change", onMq);
  const cover = cv.parentElement;
  const onMove = e => {
    if (e.target.closest("a, button")) { hover = null; cover.style.cursor = ""; return; }
    hover = hitWord(e);
    cover.style.cursor = hover ? "pointer" : "";
    if (still) frame(performance.now());
  };
  const onLeave = () => { hover = null; cover.style.cursor = ""; if (still) frame(performance.now()); };
  const onClick = e => {
    if (e.target.closest("a, button")) return;
    const o = hitWord(e);
    if (o) location.hash = "sher-" + o.no;
  };
  cover.addEventListener("mousemove", onMove);
  cover.addEventListener("mouseleave", onLeave);
  cover.addEventListener("click", onClick);
  windStop = () => {
    ro.disconnect(); io.disconnect();
    cover.removeEventListener("mousemove", onMove);
    cover.removeEventListener("mouseleave", onLeave);
    cover.removeEventListener("click", onClick);
    document.removeEventListener("visibilitychange", onVis);
    mq.removeEventListener && mq.removeEventListener("change", onMq);
    windStop = null; windEmit = null;
  };
  windEmit = (src, no, clientX, clientY) => {
    const r = cv.getBoundingClientRect();
    ctx.font = wordFont();
    const text = T(src), w = ctx.measureText(text).width, y = clientY - r.top;
    words.push({ src, no, text, w, x: clientX - r.left - w * .3, y, by: y, born: performance.now(),
      life: rnd(7000, 9000), sp: rnd(.25, .4), ph: rnd(0, 6.28), rise: rnd(.12, .22) });
  };
}

/* ── ROUTER ── */
function route(opts = {}) {
  const y = window.scrollY;
  const h = location.hash.replace("#", "");
  const m = h.match(/^sher-(\d+)$/);
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if (m) { if (windStop) windStop(); if (sceneStop) sceneStop(); renderPoem(+m[1], opts); } else renderHome();
  if (opts.keepScroll) { window.scrollTo(0, y); return; }
  if (!m && (h === "mundarija" || h === "ilhom" || h === "xat")) document.getElementById(h).scrollIntoView();
  else window.scrollTo(0, 0);
}
function current() { const m = location.hash.match(/^#sher-(\d+)$/); return m ? +m[1] : 0; }
function go(dir) { const n = current(); if (!n) return; const t = n + dir; if (t >= 1 && t <= POEMS.length) location.hash = "sher-" + t; }

window.addEventListener("hashchange", () => route());
document.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea, select")) return;
  if (e.key === "ArrowLeft") go(-1);
  else if (e.key === "ArrowRight") go(1);
  else if (e.key === "Escape" && current()) location.hash = "mundarija";
  else if ((e.key === "ArrowDown" || e.key === " ") && current() && slowMode && slowNext && !e.target.closest("button, a")) { e.preventDefault(); slowNext(); }
});
let tx = 0, ty = 0;
document.addEventListener("touchstart", e => { tx = e.changedTouches[0].clientX; ty = e.changedTouches[0].clientY; }, { passive: true });
document.addEventListener("touchend", e => {
  if (e.target.closest && e.target.closest(".maker, .letter")) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
}, { passive: true });

route();
</script>
